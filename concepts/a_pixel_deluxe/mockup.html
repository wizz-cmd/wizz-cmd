<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Deluxe Mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg: #0d1b3a; --fg: #bcd6f5; --link: #8be9ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1b3a; --fg: #bcd6f5; --link: #8be9ff; } }
  :root[data-theme="dark"] { --bg: #0d1b3a; --fg: #bcd6f5; --link: #8be9ff; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#screen { display: block; image-rendering: pixelated; max-width: 100vw; height: auto; }
  nav { padding: 10px 16px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  nav a { color: var(--link); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<canvas id="screen" width="1024" height="896"></canvas>
<nav>
  <a href="#gameplay">gameplay</a><a href="#title">title</a><a href="#cast">cast</a><a href="#debug">sprite sheet</a>
  <span>Concept A: Pixel Deluxe. Everything is drawn by code; the page reloads on hash change.</span>
</nav>
<script src="../../src/00_shared.js"></script>
<script src="../../src/30_levels.js"></script>
<script src="mockup.js"></script>
</body>
</html>
