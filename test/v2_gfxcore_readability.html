<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GFX core readability page</title>
<!-- Draws the approved mockup's creatures (concepts/c_abyss_glow/mockup.js, window.AbyssGlow) on top of GFX.levelCanvas/bgCanvas looks, to judge
     "every enemy must stay distinct on every theme". Used by test/v2_gfxcore_readability.mjs. The mockup draws a scene into #c on load; harmless. -->
<style>body{margin:0;background:#05070f}</style>
</head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<script src="../src/00_shared.js"></script>
<script src="../src/09_neon.js"></script>
<script src="../src/30_levels.js"></script>
<script>
  // the mockup defines top-level consts that must not collide with the game's: load it in an isolated scope via fetch-free script tag below
</script>
<script src="../concepts/c_abyss_glow/mockup.js"></script>
<script>window.__AG = window.AbyssGlow;</script>
<script src="../src/10_gfx.js"></script>
<script>
  window.T2 = {};
  T2.canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  /* look i at k=4 with the whole cast standing on platform tops; returns {cv, spots:[{id,x,y,w,h}]} */
  T2.cast = (i, k, withAngry) => {
    GFX.setScale(k);
    const rows = [];
    for (let r = 0; r < 26; r++) rows.push('##' + '.'.repeat(28) + '##');
    rows[0] = '#'.repeat(32); rows[25] = '#'.repeat(32);
    const plat = (r, a, b) => { rows[r] = rows[r].slice(0, a) + '#'.repeat(b - a) + rows[r].slice(b); rows[r + 1] = rows[r]; };
    plat(7, 4, 28); plat(13, 4, 28); plat(19, 4, 28);
    const W = Math.round(256 * k), H = Math.round(208 * k), cv = T2.canvas(W, H), g = cv.getContext('2d');
    g.fillStyle = '#02040a'; g.fillRect(0, 0, W, H);
    g.drawImage(GFX.bgCanvas(i), 0, 0, W, H); g.drawImage(GFX.levelCanvas(i, rows), 0, 0, W, H);
    const AG = window.__AG;
    const spots = [];
    const feet = (lx, topY, kk) => ({ x: lx * k - 8 * kk, y: (topY - 16) * k - 16 * kk });     // 16x16 box whose bottom-centre sits on (lx, topY)
    const place = (row, items) => {
      const topY = 16 + row * 8;
      items.forEach(([id, lx]) => {
        const isP = id === 'fizz' || id === 'pop', kk = (isP ? 5.9 : 4.8) * k / 4;
        const p = feet(lx, topY, kk);
        g.save();
        if (isP) AG.drawPlayer(g, id, { x: p.x, y: p.y, k: kk, t: 1.3, face: id === 'fizz' ? 1 : -1, pose: 'idle' });
        else AG.drawEnemy(g, id.replace('_angry', ''), { x: p.x, y: p.y - (id === 'jellop' || id === 'glimmer' ? 6 * k / 4 : 0), k: kk, t: 1.3, face: 1, angry: id.endsWith('_angry') });
        g.restore();
        spots.push({ id, x: p.x, y: p.y, w: 16 * kk, h: 16 * kk });
      });
    };
    place(7, [['fizz', 40], ['pop', 70], ['nibbler', 110], ['crabbit', 150], ['crabbit_angry', 190]]);
    place(13, [['jellop', 50], ['springle', 90], ['glimmer', 130], ['nibbler_angry', 170], ['fizz', 210]]);
    place(19, [['crabbit', 40], ['jellop_angry', 80], ['springle', 120], ['pop', 160], ['crabbit_angry', 200]]);
    return { cv, spots };
  };
</script>
</body>
</html>
