<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fizz &amp; Pop</title>
<style>
  /* Page chrome colours are tokens on :root. The game canvas itself is always dark; only the
     page around it follows the light/dark theme (SPEC 2.5). Dark values are declared twice on
     purpose: once for the OS preference (unless the host forces light) and once for a forced dark.
     color-scheme follows the tokens: light on :root, dark inside both dark blocks (Ut3). */
  :root {
    --page-bg: #e9eef6;
    --page-fg: #1b1033;
    --page-muted: #566080;
    --frame: #1b1033;
    --frame-glow: rgba(27, 16, 51, 0.28);
    --key-bg: #ffffff;
    --key-fg: #1b1033;
    --key-edge: #b4bcd6;
    --btn-bg: #ffffff;
    --btn-fg: #1b1033;
    --btn-edge: #98a2c6;
    --btn-on: #ff6fae;
    --btn-on-fg: #1b1033;
    --veil: rgba(8, 6, 22, 0.46);
    --veil-fg: #ffffff;
    --btn: min(68px, calc((100vw - 96px) / 4));   /* fallback before Main's fit() sets --btn-w/--btn-h */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #0b0a14;
      --page-fg: #e8e6ff;
      --page-muted: #9d9bc0;
      --frame: #26214f;
      --frame-glow: rgba(120, 104, 255, 0.28);
      --key-bg: #1b1933;
      --key-fg: #e8e6ff;
      --key-edge: #3c3868;
      --btn-bg: #1b1933;
      --btn-fg: #e8e6ff;
      --btn-edge: #4a4680;
      --btn-on: #ff6fae;
      --btn-on-fg: #1b1033;
      --veil: rgba(4, 3, 14, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #0b0a14;
    --page-fg: #e8e6ff;
    --page-muted: #9d9bc0;
    --frame: #26214f;
    --frame-glow: rgba(120, 104, 255, 0.28);
    --key-bg: #1b1933;
    --key-fg: #e8e6ff;
    --key-edge: #3c3868;
    --btn-bg: #1b1933;
    --btn-fg: #e8e6ff;
    --btn-edge: #4a4680;
    --btn-on: #ff6fae;
    --btn-on-fg: #1b1033;
    --veil: rgba(4, 3, 14, 0.5);
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  /* No pinch / double-tap zoom, no pull-to-refresh or rubber-banding, no text selection (Ut1).
     pan-x pan-y (instead of none) keeps a degenerate, overflowing frame scrollable. */
  html, body {
    touch-action: pan-x pan-y; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  html { overflow-x: hidden; }
  body {
    background: var(--page-bg);
    color: var(--page-fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 8px 16px;                 /* 16 px side gutters, also on a 360 px phone */
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- stage: canvas + legend. margin-block:auto centres it vertically but, unlike justify-content:center,
     never pushes an overflowing stage above the top edge where it could not be scrolled to (Ut4). ---- */
  #stage {
    flex: 0 0 auto; width: 100%; margin-block: auto;
    display: flex; flex-direction: column; align-items: center;
  }
  /* Phones in portrait (K2): the page is exactly as tall as the padded viewport (Main publishes --page-h), the controls rest at its
     bottom (thumb zone, inside any root padding / safe area) and the picture is centred in the space above them. No band below. */
  html.touch:not(.land) body { min-height: var(--page-h, 100%); }
  html.touch:not(.land) #stage { flex: 1 1 auto; margin-block: 0; }
  html.touch:not(.land) #frame { margin-block: auto; }
  #frame { position: relative; line-height: 0; max-width: 100%; }
  #screen {
    display: block;
    /* Safe default before Main's fit() sets explicit px sizes: never wider than the page. */
    width: min(100%, 768px); height: auto; aspect-ratio: 256 / 224;
    background: #000;
    image-rendering: crisp-edges;
    image-rendering: pixelated;       /* Main switches to auto (sharp-bilinear) when the scale is not a whole device-pixel multiple */
    border-radius: 3px;
    outline: 4px solid var(--frame);
    box-shadow: 0 10px 34px var(--frame-glow);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }

  /* click-to-play / focus overlay (an Artifact iframe starts without keyboard focus). Light veil: the picture stays visible. */
  #focus {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--veil); color: var(--veil-fg);
    border-radius: 3px; cursor: pointer; text-align: center; line-height: 1.3;
    font-weight: 800; letter-spacing: 0.14em; font-size: clamp(16px, 4.4vw, 30px);
    outline: none; -webkit-tap-highlight-color: transparent;
  }
  #focus .cta {
    padding: 0.35em 1.1em; border-radius: 999px;
    background: rgba(8, 6, 22, 0.78); border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  #focus small {
    font-weight: 600; letter-spacing: 0.03em; font-size: clamp(11px, 2.4vw, 14px);
    padding: 3px 10px; border-radius: 8px; background: rgba(8, 6, 22, 0.6); max-width: 92%;
  }
  @keyframes pulse { 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { #focus .cta { animation: none; } }

  /* compact controls legend (desktop only; Main hides it when it would cost the picture a scale step) */
  #legend {
    margin: 12px 0 0; max-width: 940px; text-align: center;
    color: var(--page-muted); font-size: 12px; line-height: 1.9;
  }
  #legend .grp { display: inline-block; margin: 0 8px; white-space: nowrap; }
  #legend b { color: var(--page-fg); margin-right: 3px; }
  #legend kbd {
    display: inline-block; min-width: 1.6em; padding: 0 5px; margin: 0 1px; text-align: center;
    font: 600 11px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--key-fg); background: var(--key-bg);
    border: 1px solid var(--key-edge); border-bottom-width: 2px; border-radius: 4px;
  }

  /* ---- touch controls: shown for (pointer: coarse) or after the first touch (class .touch on the root element).
     Main's fit() sets --btn-w / --btn-h and one of three arrangements on the root element:
       (none)   portrait: picture on top, then a PAUSE/SOUND row, then the four big buttons directly below it
       .land    landscape: pads at both sides of the picture, PAUSE/SOUND stacked top right
       .over    frames too small for either: the same fixed pads, drawn translucent over the picture's margins ---- */
  #touch { display: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html.touch #legend { display: none; }
  html.touch #touch {
    display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    width: 100%; flex: 0 0 auto; padding: 10px 0 8px;
  }
  #touch .pads { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  #touch .grp { display: flex; gap: 8px; align-items: flex-start; }
  #touch .mid { order: -1; justify-content: center; align-items: center; gap: 16px; }
  #touch button {
    appearance: none; -webkit-appearance: none; margin: 0; padding: 0;
    width: var(--btn-w, var(--btn)); height: var(--btn-h, var(--btn)); border-radius: 50%;
    font: 800 12px/1 system-ui, sans-serif; letter-spacing: 0;
    color: var(--btn-fg); background: var(--btn-bg);
    border: 2px solid var(--btn-edge); box-shadow: 0 3px 0 var(--btn-edge);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  html:not(.land) #touch .pads button { border-radius: 24px; }
  #touch button[data-k="left"], #touch button[data-k="right"] { font-size: 28px; }
  #touch button.on { background: var(--btn-on); color: var(--btn-on-fg); transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-edge); }
  #touch button.sm { width: auto; min-width: 96px; height: 44px; padding: 0 18px; border-radius: 22px; font-size: 12px; letter-spacing: 0.04em; }
  #touch button[data-k="sound"][data-muted="1"] { text-decoration: line-through; opacity: 0.7; }

  /* landscape + overlay: the groups are fixed to the screen sides so they never push the picture around */
  html.touch.land #touch { position: fixed; inset: 0; display: block; padding: 0; pointer-events: none; }
  html.touch.land #touch .pads { display: block; }
  html.touch.land #touch .grp { position: absolute; pointer-events: auto; }
  /* inside the root padding Main measured (--pad-*: a host that pads :root for safe areas) and inside env() insets, whichever is larger (R3) */
  html.touch.land #touch .left { left: max(calc(var(--pad-l, 0px) + 12px), env(safe-area-inset-left)); bottom: max(calc(var(--pad-b, 0px) + 12px), env(safe-area-inset-bottom)); align-items: flex-end; }
  html.touch.land #touch .right { right: max(calc(var(--pad-r, 0px) + 12px), env(safe-area-inset-right)); bottom: max(calc(var(--pad-b, 0px) + 12px), env(safe-area-inset-bottom)); align-items: flex-end; }
  html.touch.land #touch .mid {
    top: max(calc(var(--pad-t, 0px) + 12px), env(safe-area-inset-top)); right: max(calc(var(--pad-r, 0px) + 12px), env(safe-area-inset-right));
    flex-direction: column; align-items: flex-end; gap: 8px;
  }
  html.touch.over #touch .grp { opacity: 0.62; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="screen" width="256" height="224" role="img" aria-label="Fizz and Pop game screen"></canvas>
    <div id="focus" role="button" tabindex="0" hidden>
      <span class="cta">CLICK TO PLAY</span>
      <small>Click here to focus the game and switch the sound on</small>
    </div>
  </div>
  <p id="legend">
    <span class="grp"><b>P1</b> <kbd>&larr;</kbd><kbd>&rarr;</kbd> move <kbd>&uarr;</kbd>/<kbd>X</kbd> jump <kbd>Space</kbd>/<kbd>Z</kbd> bubble</span>
    <span class="grp"><b>P2</b> <kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>Q</kbd>/<kbd>Left Shift</kbd> bubble <small>(keys follow the WASD block)</small></span>
    <span class="grp"><b>Pad</b> stick / d-pad move <kbd>A</kbd> jump <kbd>B</kbd> bubble <kbd>Start</kbd> pause</span>
    <span class="grp"><kbd>Enter</kbd> start <kbd>P</kbd> pause <kbd>M</kbd> sound <kbd>H</kbd> help</span>
  </p>
  <noscript><p style="color:var(--page-fg)">Fizz &amp; Pop needs JavaScript.</p></noscript>
</div>
<div id="touch" aria-label="Touch controls">
  <div class="grp mid"><button type="button" class="sm" data-k="pause" tabindex="-1">PAUSE</button><button type="button" class="sm" data-k="sound" tabindex="-1">SOUND</button></div>
  <div class="pads">
    <div class="grp left"><button type="button" data-k="left" tabindex="-1" aria-label="Move left">&#9664;</button><button type="button" data-k="right" tabindex="-1" aria-label="Move right">&#9654;</button></div>
    <div class="grp right"><button type="button" data-k="fire" tabindex="-1">BUBBLE</button><button type="button" data-k="jump" tabindex="-1">JUMP</button></div>
  </div>
</div>
<script>
(() => { "use strict";

/* ===== 00_shared.js ===== */
/* FIZZ & POP — 00_shared.js
 * Shared constants (C) and utilities (U). Contract: SPEC §2.4.
 *
 * Design notes:
 *  - C is frozen; every module may use C and U at load time.
 *  - U.rng is mulberry32: tiny, fast, good enough for gameplay randomness, fully
 *    deterministic for a given 32-bit seed (needed for reproducible test runs).
 *  - U.store wraps localStorage. EVERY access is inside try/catch (private windows,
 *    sandboxed iframes and blocked site data all throw). When storage is unusable we
 *    fall back to an in-memory Map so the game keeps working for the session.
 *    Values are JSON-encoded; a corrupt entry yields the fallback, never an exception.
 */
const C = Object.freeze({
  W: 256, H: 224, TILE: 8, COLS: 32, ROWS: 26, MAP_Y: 16, FPS: 60,
  INNER_L: 16, INNER_R: 240,            // x bounds inside the outer walls
  STORE_PREFIX: 'fizzpop.v1.',
});

const U = (() => {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);

  /** Move v toward target by at most step (step is treated as a magnitude). */
  const approach = (v, target, step) => {
    step = Math.abs(step);
    if (v < target) return Math.min(v + step, target);
    if (v > target) return Math.max(v - step, target);
    return target;
  };

  /** Axis-aligned rectangle overlap (touching edges do NOT overlap). */
  const overlap = (ax, ay, aw, ah, bx, by, bw, bh) =>
    ax < bx + bw && bx < ax + aw && ay < by + bh && by < ay + ah;

  /** mulberry32 seeded PRNG. Same seed -> same sequence, always. */
  const rng = (seed) => {
    let s = (seed === undefined || seed === null || Number.isNaN(+seed) ? 1 : +seed) >>> 0;
    const next = () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      /** Integer in [a, b], both inclusive. */
      int: (a, b) => {
        if (b === undefined) { b = a; a = 0; }
        if (b < a) { const t = a; a = b; b = t; }
        return a + Math.floor(next() * (b - a + 1));
      },
      /** Float in [a, b). */
      float: (a = 0, b = 1) => a + next() * (b - a),
      /** Random element of a non-empty array (undefined for an empty one). */
      pick: (arr) => (arr.length ? arr[Math.floor(next() * arr.length)] : undefined),
      /** True with probability p. */
      chance: (p) => next() < p,
    };
  };

  /** JSON key/value store with localStorage + in-memory fallback. */
  const store = (() => {
    const mem = new Map();
    const get = (key, fallback) => {
      const k = C.STORE_PREFIX + key;
      try {
        const raw = window.localStorage.getItem(k);
        if (raw !== null && raw !== undefined) return JSON.parse(raw);
      } catch (e) { /* storage unavailable or corrupt JSON: fall through to memory */ }
      return mem.has(k) ? mem.get(k) : fallback;
    };
    const set = (key, value) => {
      const k = C.STORE_PREFIX + key;
      mem.set(k, value);                         // always mirror in memory
      try { window.localStorage.setItem(k, JSON.stringify(value)); } catch (e) { /* ignore */ }
    };
    return { get, set };
  })();

  return { clamp, lerp, sign, approach, overlap, rng, store };
})();


/* ===== 10_gfx.js ===== */
/* FIZZ & POP - 10_gfx.js
 * All art of the game, generated at runtime from hand-authored palette-indexed string grids.
 * Contract: SPEC sec. 3.1 (public API) and sec. 5 (art direction). No assets, no network, no dependencies.
 *
 * How the art pipeline works
 *  - Every sprite is a set of grids (arrays of equal-length strings). '.' = transparent, any other
 *    character is a palette key. Sprites face RIGHT; flipping is a cached draw option.
 *  - Characters/items are authored as "fill only" grids; sprite() adds the 1 px dark outline
 *    automatically (4-neighbourhood, so shapes stay round). Internal outlines are typed as 'o'.
 *    Delicate parts (axolotl gills, jellyfish tentacles, anglerfish stalk) are excluded from casting
 *    an outline, so they read as soft feathers instead of heavy bars.
 *  - Animation frames are composed from hand-authored parts (put() stamps one grid on another),
 *    "angry" enemies are palette swaps of the very same finished grids (keys v / V are brow / eyelid
 *    pixels that are invisible in the normal palette), Pop is a palette swap of Fizz, and "_die" frames
 *    are the four 90 degree rotations of one hand-drawn dizzy pose.
 *  - Symmetric creatures (crab, jellyfish, kraken crown/face) are drawn as half grids and mirrored (sym()).
 *  - A few big round masses use small generators instead of typing every pixel: disc() for bubbles,
 *    shadedEllipse() (light from the top-left, 4 bands + 2x2 ordered dither) for the kraken dome, pearls,
 *    bomb and moon pearl; arm() sweeps tapered kraken arms along hand-picked centre lines.
 *    All features (eyes, mouths, crowns, icons, frills ...) are hand-typed grids.
 *  - Each sprite is rendered once (init) into ONE atlas strip canvas (frames side by side); mirrored and
 *    white-silhouette strips are derived lazily on first use. draw() only blits cached strips.
 *    The kraken family (kraken, kraken_angry, kraken_trapped, moonpearl) is built on first draw (round 30
 *    only); has()/size()/frames() already answer for it without building.
 *  - Font: table of 7-column glyph strings in an 8 x 8 cell; tinted glyph strips are cached per colour and
 *    whole strings are cached as pre-composed canvases (HUD text = 1 drawImage).
 *  - Level looks: 6 theme patterns (hand-authored 8 x 8 tiles) x 5 palette/mix variants. Outer walls use the
 *    first tile at double size (16 x 16 blocks). Edges are bevelled from the neighbours' emptiness and a
 *    BB-style drop shadow (3 px right/down, 50 % black) falls on empty cells only.
 *  - drawLogo: puffy bubble letters rasterised from stroke skeletons into per-pixel masks (outline, bevel,
 *    dithered pink -> violet -> blue -> aqua gradient, drifting bubbles, sweeping shine), no anti-aliasing.
 *
 * Choices where the SPEC is silent
 *  - Anchors: sprite (x, y) is always the top-left corner. Trapped frames are 12 x 12 poses centred in the
 *    16 x 16 box so trap_overlay (same box) wraps them. bubble_shot discs (8/12/15 px) are centred in 16 x 16.
 *    flame is 8 x 16 with its base on the bottom row (draw at tileTop - 16).
 *  - Unknown sprite names: draw() warns once and draws a magenta 16 x 16 box (never throws).
 *  - draw(): frame is floor()ed then wrapped modulo the frame count (NaN -> 0). Calls before init() build first.
 *  - white:true keeps each pixel's alpha (translucent bubble pixels stay translucent) and sets RGB to 255.
 *  - text(): shadow offset is one font pixel (= scale px); string/colour caches are capped and reset when full.
 *  - levelCanvas: columns 0-1 and 30-31 are always drawn as wall blocks, cells outside the map count as wall,
 *    short rows/maps are tolerated. theme(i).accent = variant highlight colour, accent2 = variant accent colour
 *    (both bright, readable on the near-black backgrounds).
 *  - drawLogo(ctx, cx, y, t): y is the TOP of the logo (letters start at y+5, wobble +-2), about 219 x 38 px
 *    plus three bubbles drifting up to about y-20.
 *  - Wave 2 (FIXPLAN sec. 2): players are drawn in a 3/4 view facing right (eyes + mouth on the front half of the face, three
 *    full rear gills vs two far-side stubs, paddle tail that wags / lifts); Springle is a seahorse (crown + mane, tube snout,
 *    ringed belly, dorsal fin, lime tail ring turning into the spring); Crabbit has raised open pincers and V eye stalks;
 *    Nibbler wears a spinning cog instead of a key; enemy hues: gold / orange / violet / lime / cobalt. "Angry" = shared
 *    crimson ramp + dark eye sockets with yellow pupils + two steam puffs (addSteam) that rise in alternating phases.
 *    Bubbles carry a dark navy outer ring (trap_overlay trades its blue ring for it); bolt has a white-hot core; the moon
 *    pearl glows lilac-white; pu_shoes is a pair of flippers, food_2 an open clam with a pearl.
 *  - text(ctx, s, x, y, color, {outline:'#rrggbb'}): one font pixel (= scale px) outline in all 8 directions behind the glyphs;
 *    it replaces the default drop shadow unless {shadow:true} is also given.
 *  - bgCanvas(levelIndex): opaque 256 x 208 canvas, cached: near-black dithered gradient + faint (alpha <= 0.12) theme
 *    silhouettes, hue per variant; theme(i).bg is now per variant too (row 0 of bgCanvas == theme(i).bg).
 *  - Tile art is toned per variant (lightness x, saturation x, hue shift: `t` / `at` on each variant) so sprites pop (G9).
 *  - Wave 3 (FIXPLAN2 + review findings): Springle redrawn as a slim S seahorse (thin tube snout stepping down, thin neck, pot belly,
 *    2 px lilac dorsal fin, long tail curling forward into a spiral; the bounce sinks the body 1 row and flattens the spiral); crabbit_throw / springle_squash /
 *    glimmer_fire have *_angry twins (palette swap + steam) so the angry cue never drops out in an action pose - Game.drawEnemy
 *    must select '<pose>_angry' while e.angry; players' eyes sit 1.5 px towards the facing side (mouth 1 px more); pu_shoes is
 *    a pair of swim fins (pocket + dark opening + strap, blade that only widens, scalloped tip); bolt is one hard Z; the Nibbler cog is
 *    steel blue (its own keys x / X, legs S); angry eye sockets #4a0818; K5 camouflage: volcanic seams are deep crimson / coral,
 *    R17 / R14 tile tones were pulled away from Pop / Glimmer / lantern colours, ship + temple silhouettes are lifted towards white.
 *  - Non-contract extras (tests only): GFX._registry(), GFX._lint(), GFX._timings().
 */
const GFX = (() => {
  // ===================================================================================================
  // 0. Constants and small helpers
  // ===================================================================================================
  const OL = '#1b1033';                      // universal dark outline (not pure black)
  const TILE = C.TILE;

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const lintLog = [];
  const lint = (msg) => { if (lintLog.length < 200) lintLog.push(msg); };

  /** '#rgb' | '#rrggbb' | '#rrggbbaa' | [r,g,b,a] -> [r,g,b,a] */
  function parseColor(s) {
    if (Array.isArray(s)) return s;
    let h = String(s).replace('#', '');
    if (h.length === 3) h = h.split('').map((x) => x + x).join('');
    if (h.length === 6) h += 'ff';
    const n = parseInt(h, 16);
    return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  }
  const prep = (pal) => {
    const out = {};
    for (const k of Object.keys(pal)) out[k] = parseColor(pal[k]);
    return out;
  };
  /** Grid literal: rows separated by newlines; all whitespace inside a row is ignored (so rows can be grouped in 4s). */
  const G = (s) => s.split('\n').map((r) => r.replace(/\s+/g, '')).filter((r) => r.length > 0);

  // ---- grid operations (all pure; grids are arrays of strings) ------------------------------------------
  const blank = (w, h) => Array.from({ length: h }, () => '.'.repeat(w));
  /** Stamp `top` onto `base` at (ox, oy); '.' in `top` leaves the base pixel alone. */
  function put(base, top, ox = 0, oy = 0) {
    const out = base.map((r) => r.split(''));
    top.forEach((row, j) => {
      const y = oy + j;
      if (y < 0 || y >= out.length) return;
      for (let i = 0; i < row.length; i++) {
        const x = ox + i;
        if (row[i] !== '.' && x >= 0 && x < out[y].length) out[y][x] = row[i];
      }
    });
    return out.map((r) => r.join(''));
  }
  /** Same as put() but the character `clear` in `top` erases the base pixel. */
  function putErase(base, top, ox, oy, clear = '-') {
    const out = base.map((r) => r.split(''));
    top.forEach((row, j) => {
      const y = oy + j;
      if (y < 0 || y >= out.length) return;
      for (let i = 0; i < row.length; i++) {
        const x = ox + i;
        if (row[i] === '.' || x < 0 || x >= out[y].length) continue;
        out[y][x] = row[i] === clear ? '.' : row[i];

  /** Add a 1 px outline (char `ch`) in every transparent cell touching an opaque one. */
  function outlineGrid(grid, ch = 'o', diag = false, skip = '') {
    const h = grid.length, w = grid[0].length;
    const solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && grid[y][x] !== '.' && !skip.includes(grid[y][x]);
    return grid.map((row, y) => {
      let s = '';
      for (let x = 0; x < w; x++) {
        if (row[x] !== '.') { s += row[x]; continue; }
        const hit = solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1) ||
          (diag && (solid(x - 1, y - 1) || solid(x + 1, y - 1) || solid(x - 1, y + 1) || solid(x + 1, y + 1)));
        s += hit ? ch : '.';
      }
      return s;
    });

    const n = grid.length;
    return Array.from({ length: n }, (_, y) => Array.from({ length: n }, (_, x) => grid[n - 1 - x][y]).join(''));
  };
  const mirrorGrid = (grid) => grid.map((r) => r.split('').reverse().join(''));
  /** Shift a grid by (dx, dy), filling with transparent. */
  function shiftGrid(grid, dx, dy) {
    const h = grid.length, w = grid[0].length;
    return Array.from({ length: h }, (_, y) => {
      const sy = y - dy;
      if (sy < 0 || sy >= h) return '.'.repeat(w);
      let s = '';

      return s;
    });

  const place = (grid, w, h, ox, oy) => put(blank(w, h), grid, ox, oy);

  const stamp = (parts, w = 16, h = 16) => parts.reduce((g, [y, x, s]) => put(g, [s], x, y), blank(w, h));

  /** Rasterise a polyline of [x,y] points into a w x h grid of char `ch` (thickness in px, 1 = thin). */
  function polyline(w, h, pts, ch, thick = 1, base) {
    const g = (base || blank(w, h)).map((r) => r.split(''));
    const dot = (x, y) => { for (let j = 0; j < thick; j++) for (let i = 0; i < thick; i++) { const xx = x + i, yy = y + j; if (xx >= 0 && yy >= 0 && xx < w && yy < h) g[yy][xx] = ch; } };
    for (let k = 0; k + 1 < pts.length; k++) {
      const [x0, y0] = pts[k], [x1, y1] = pts[k + 1];
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
      for (let i = 0; i <= n; i++) dot(Math.round(x0 + ((x1 - x0) * i) / n), Math.round(y0 + ((y1 - y0) * i) / n));
    }
    return g.map((r) => r.join(''));
  }

  /**
   * Shaded ellipse w x h for big round masses (kraken head, pearls). Light from the top-left; bands
   * h (highlight) / l / m / d with a 2x2 ordered dither on the band borders. keys = 'hlmd' mapping.
   */
  function shadedEllipse(w, h, keys = 'hlmd', ditherAmt = 0.05, th = [0.8, 0.5, 0.12]) {
    const cx = (w - 1) / 2, cy = (h - 1) / 2, rx = w / 2, ry = h / 2;
    const L = [-0.52, -0.62, 0.6];
    const Ln = Math.hypot(L[0], L[1], L[2]);
    const bayer = [[0, 2], [3, 1]];
    const rows = [];
    for (let y = 0; y < h; y++) {
      let r = '';
      for (let x = 0; x < w; x++) {
        const nx = (x - cx) / rx, ny = (y - cy) / ry, d2 = nx * nx + ny * ny;
        if (d2 > 1) { r += '.'; continue; }
        const nz = Math.sqrt(1 - d2);
        let v = (nx * L[0] + ny * L[1] + nz * L[2]) / Ln;
        v += (bayer[y & 1][x & 1] / 4 - 0.375) * ditherAmt * 2;
        r += v > th[0] ? keys[0] : v > th[1] ? keys[1] : v > th[2] ? keys[2] : keys[3];
      }
      rows.push(r);
    }
    return rows;
  }

  // ---- rendering grids into canvases ---------------------------------------------------------------------
  /** Paint one grid into ImageData `d` (a strip `stride` px wide) at column offset `x0`. */
  function paintGrid(d, stride, x0, grid, w, h, P, name) {
    if (grid.length !== h) lint(`${name}: ${grid.length} rows, expected ${h}`);
    for (let y = 0; y < h; y++) {
      const row = grid[y] || '';
      if (row.length !== w) lint(`${name}: row ${y} has ${row.length} chars, expected ${w}`);
      for (let x = 0; x < w; x++) {
        const ch = row[x];
        if (ch === undefined || ch === '.') continue;
        const col = P[ch];
        if (!col) { lint(`${name}: unknown palette key '${ch}' at ${x},${y}`); continue; }
        const i = (y * stride + x0 + x) * 4;
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col[3];

  /** One canvas holding all frames side by side (a sprite atlas strip). */
  function renderStrip(grids, w, h, P, name) {
    const n = grids.length, cv = mk(w * n, h), img = new ImageData(w * n, h);
    grids.forEach((g, k) => paintGrid(img.data, w * n, k * w, g, w, h, P, name));
    cv.getContext('2d').putImageData(img, 0, 0);

  // ---- sprite registry: one atlas strip per sprite (frames side by side) ------------------------------------
  const REG = Object.create(null);
  const ORDER = [];
  let initDone = false;

  /** Register a sprite from an atlas strip canvas (n frames, each w x h). */
  function addStrip(name, w, h, strip, n) {
    const lazyEntry = REG[name];
    if (lazyEntry && !lazyEntry.a) {                       // a lazily registered sprite being built now
      if (lazyEntry.w !== w || lazyEntry.h !== h || lazyEntry.n !== n) lint(`${name}: lazy size/frames mismatch`);
      lazyEntry.a = strip;
      return;
    }
    if (lazyEntry) lint(`duplicate sprite ${name}`);
    REG[name] = { w, h, n, a: strip, run: null, fl: null, wh: null, wf: null };
    ORDER.push(name);
  }
  /**
   * Register sprites that are built on first use (the boss family: only seen in round 30). `specs` =
   * [[name, w, h, frames], ...]; `fn` builds all of them (via sprite()/addSprite()) and runs once.
   * Sizes and frame counts are known up front, so has()/size()/frames() never trigger the build.
   */
  function lazyGroup(specs, fn) {
    let done = false;
    const run = () => { if (!done) { done = true; fn(); } };
    for (const [name, w, h, n] of specs) {
      REG[name] = { w, h, n, a: null, run, fl: null, wh: null, wf: null };
      ORDER.push(name);
    }
  }
  /** Register a sprite from separate frame canvases (packed into a strip). */
  function addSprite(name, w, h, cvs) {
    if (cvs.length === 1) { addStrip(name, w, h, cvs[0], 1); return; }
    const strip = mk(w * cvs.length, h), g = strip.getContext('2d');
    cvs.forEach((c, k) => g.drawImage(c, k * w, 0));
    addStrip(name, w, h, strip, cvs.length);
  }
  /**
   * Define a sprite from fill grids. `o.outline` (default true) adds the dark outline; `o.diag`
   * makes the outline 8-neighbour. Returns the finished grids so callers can derive other sprites.
   */
  function sprite(name, w, h, pal, grids, o = {}) {
    const fin = o.outline === false ? grids : grids.map((g) => outlineGrid(g, 'o', !!o.diag, o.skip || ''));
    spriteFinished(name, w, h, pal, fin);
    return fin;
  }
  /** Re-use finished grids with another palette (angry enemies, Pop). */
  function spriteFinished(name, w, h, pal, fin) {
    addStrip(name, w, h, renderStrip(fin, w, h, prep(Object.assign({ o: OL }, pal)), name), fin.length);
    return fin;
  }

  // ---- flipped / white variants (whole strips), lazily cached on first use -----------------------------------
  function derive(s, flip, white) {
    const w = s.w, h = s.h, n = s.n, W = w * n;
    let a = s.a.__px;
    if (!a) a = s.a.__px = s.a.getContext('2d').getImageData(0, 0, W, h).data;   // composed strips: read once, then cached
    const out = new ImageData(W, h), b = out.data;
    for (let y = 0; y < h; y++) {
      for (let k = 0; k < n; k++) {
        for (let x = 0; x < w; x++) {
          const si = (y * W + k * w + x) * 4, di = (y * W + k * w + (flip ? w - 1 - x : x)) * 4;
          if (white) { b[di] = 255; b[di + 1] = 255; b[di + 2] = 255; b[di + 3] = a[si + 3]; }
          else { b[di] = a[si]; b[di + 1] = a[si + 1]; b[di + 2] = a[si + 2]; b[di + 3] = a[si + 3]; }
        }
      }
    }

    cv.getContext('2d').putImageData(out, 0, 0);

    if (white) return flip ? (s.wf || (s.wf = derive(s, true, true))) : (s.wh || (s.wh = derive(s, false, true)));

  // ===================================================================================================
  // 1. PLAYERS: Fizz (p1, pink) and Pop (p2, aqua/lavender), drawn in a 3/4 view FACING RIGHT.
  //    One set of grids, two palettes.  Keys: b body, l light, d shade, g/G/h frill (mid/dark/tip),
  //    c belly/cream (also eye glint), e eye, k blush, y star (stun only)

  // ===================================================================================================

  const PAL_P2 = { b: '#74e6e8', l: '#c9fbf6', d: '#3ab5cb', g: '#9a7cf2', G: '#5b43bf', h: '#c9fbf6', c: '#f4f0ff', e: '#231a4d', k: '#b69cff', y: '#ffe36b' };

  const pad16 = (rows) => rows.concat(blank(16, 16 - rows.length));
  const SKIP_FRILL = 'gGh';

    ................
    ................
    .......llbb.....
    ......lllbbd....
    .....llbbbbbd...
    .....lbbbbbbd...
    .....lbbbbbbd...
    .....lbbbbbbd...
    .....bbbbbbdd...
    ......bbbbdd....
    ......oooooo....`));

  const FROND_NEAR = G(`
    hg..
    .ggG
    ....
    hggg
    .ggG
    ....
    hg..
    .ggG`);
  // far-side gills: only the tips peek out behind the face
  const FROND_FAR = G(`
    .g.
    GG.
    ...
    .g.
    GG.`);
  const EYE_OPEN = G(`
    ce
    ee`);
  const EYE_BLINK = G(`
    ..
    ee`);
  const EYE_SQUINT = G(`
    ee
    ..`);
  const EYE_X = G(`
    e.e
    .e.
    e.e`);
  const EYE_SPIRAL_A = G(`
    eee
    ece
    eee`);
  const EYE_SPIRAL_B = G(`
    eee
    eec
    eee`);
  const M_SMILE = G(`
    G..G
    .GG.`);
  const M_O = G(`
    GG
    ee`);
  const M_PUCKER = G(`
    ..
    GG`);
  const M_WAVY = G(`
    G.G.
    .G.G`);

  // torso + feet + arms ---------------------------------------------------------------------------------
  const rowsAt = (rows, y0) => blank(16, y0).concat(rows).concat(blank(16, 16 - y0 - rows.length));
  const BODY_PARTS = {

    stand: rowsAt(G(`
      ......lbbbccd...
      ......lbbbcccbb.
      .......bbbccd.d.
      ......bbd.bbd...`), 11),
    contact: rowsAt(G(`
      ......lbbbccd...
      ......lbbbcccbb.
      .......bbbccd.d.
      ......bbd...bbd.`), 11),
    passR: rowsAt(G(`
      ......lbbbccd...
      ......lbbbcccbb.
      .......bbbcc.bb.
      ......bbd.......`), 11),
    passL: rowsAt(G(`
      ......lbbbccd...
      ......lbbbcccbb.
      ......bb.bccd.d.
      ..........bbd...`), 11),
    tuck: rowsAt(G(`
      ......lbbbccd...
      ......lbbbcccbb.
      .......bbbccd.d.
      .......bbbbbd...`), 11),
    dangle: rowsAt(G(`
      ......lbbbccd...
      .....bbbbbcccbb.
      .......bbbccd...
      ......bd...bd...`), 11),
    flung: rowsAt(G(`
      ....b.lbbbccd.b.
      ....bblbbbcccbb.
      .......bbbccd...
      ......bbd.bbd...`), 11),
    shoot: rowsAt(G(`
      ......lbbbccd...
      ......lbbbcccbbb
      .......bbbccd...
      ......bbd.bbd...`), 11),
  };

    up: G(`
      lll...
      lllbbd
      .ddbbd
      ......`),
    mid: G(`
      ......
      .lllbd
      lbbbbd
      .ddd..`),
    down: G(`
      ......
      ....bd
      .lllbd
      lbdddd`),
  };

  /** Compose one player frame (fill grid; the outline is added by sprite()). */
  function playerFrame(o) {

    g = put(g, o.tail || TAIL.up, 0, 11);

  // ===================================================================================================
  // 2. BUBBLES (translucent: o outline, r rim, f fill, g inner glow, w shine) and special icons
  // ===================================================================================================
  /**
   * Filled ellipse w x h in concentric 1 px rings (4-neighbour erosion => classic round look), outermost first:
   * rings = 2: o, r, then fill f;   rings = 3: n (dark navy outer ring, G11), o, r, then fill f.
   */
  function disc(w, h, rings = 2) {
    const cx = (w - 1) / 2, cy = (h - 1) / 2, rx = w / 2, ry = h / 2;
    const inside = (x, y) => x >= 0 && y >= 0 && x < w && y < h && (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2) <= 1;
    const erode = (pred) => (x, y) => pred(x, y) && pred(x - 1, y) && pred(x + 1, y) && pred(x, y - 1) && pred(x, y + 1);
    const layers = [inside];
    for (let i = 0; i < rings; i++) layers.push(erode(layers[i]));
    const keys = rings === 3 ? 'nor' : 'or';
    const rows = [];
    for (let y = 0; y < h; y++) {
      let r = '';
      for (let x = 0; x < w; x++) {
        let ch = 'f';
        for (let i = 0; i <= rings; i++) if (!layers[i](x, y)) { ch = i === 0 ? '.' : keys[i - 1]; break; }
        r += ch;
      }
      rows.push(r);
    }

  }

  const BUB_SHINE = stamp([[4, 5, 'www'], [5, 4, 'ww'], [6, 4, 'w'], [7, 4, 'w'], [10, 11, 'g'], [11, 10, 'gg'], [12, 9, 'ggg'], [13, 7, 'ggg'], [14, 5, 'gg']]);

  const bubbleBase = (w, h, shine = BUB_SHINE) => {
    const d = disc(w, h, 3);
    let g = place(d, 16, 16, (16 - w) >> 1, (16 - h) >> 1);
    if (shine) g = put(g, shiftGrid(shine, (w - 16) >> 1, (h - 16) >> 1));
    return g;
  };
  const NAVY = '#0b1030cc';
  const tint = (o, r, f, g) => ({ n: NAVY, o, r, f, g, w: '#ffffff' });

  // special icons, 8 x 10, drawn with their own dark outline
  const ICON_BOLT = G(`
    ....yyy.
    ...yyy..
    ..yyy...
    .yyyyyy.
    ....yyy.
    ...yyy..
    ..yyy...
    ..yy....
    .yy.....
    .y......`);
  const ICON_FLAME = G(`
    ...r....
    ...rr...
    ..rrrr..
    ..rorrr.
    .rrooorr
    .rooyyor
    rrooyyor
    rrooyyor
    .rooyyo.
    ..rooor.`);
  const ICON_DROP = G(`
    ....b...
    ...bb...
    ..bbbb..
    ..bwbbb.
    .bwbbbbd
    .bwbbbbd
    .bbbbbdd
    .bbbbbdd
    ..bbbdd.
    ...ddd..`);

  // pop animation: dashed ring bursting outwards (frame 0), droplets flying (1), glints fading (2).
  // Dots are placed on circles around the bubble centre (7.5, 7.5) at hand-picked radii/angles.
  function popFrame(radius, count, size, offsetDeg, ch, extra, skip) {
    const g = blank(16, 16).map((r) => r.split(''));
    const dot = (x, y, c) => { for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) { const xx = x + i, yy = y + j; if (xx >= 0 && yy >= 0 && xx < 16 && yy < 16) g[yy][xx] = c; } };
    for (let k = 0; k < count; k++) {
      if (skip && skip(k)) continue;
      const a = ((offsetDeg + (360 * k) / count) * Math.PI) / 180;
      dot(Math.round(7.5 - size / 2 + Math.cos(a) * radius), Math.round(7.5 - size / 2 + Math.sin(a) * radius), ch);
    }
    if (extra) extra(dot);
    return g.map((r) => r.join(''));
  }
  const POP = [
    // dashed ring: 8 arcs of two dots each, with a bright core flash
    popFrame(6.8, 24, 2, 7.5, 'r', (dot) => { dot(7, 7, 'w'); }, (k) => k % 3 === 2),
    popFrame(6.2, 8, 2, 22.5, 'r', (dot) => { dot(7, 7, 'w'); }),
    popFrame(7.2, 8, 1, 0, 'w', (dot) => { for (const a of [22.5, 112.5, 202.5, 292.5]) dot(Math.round(7.5 + Math.cos((a * Math.PI) / 180) * 4), Math.round(7.5 + Math.sin((a * Math.PI) / 180) * 4), 'r'); }),
  ];

  function buildBubbles() {
    const none = { outline: false };
    const wide = bubbleBase(16, 15), tall = bubbleBase(15, 16);
    sprite('bubble', 16, 16, BUB_PAL, [wide, tall], none);
    // about to pop: red, then hot yellow-white flicker
    addSprite('bubble_warn', 16, 16, [
      render(wide, 16, 16, prep(tint('#a8203cd8', '#ffb3a0', '#ff5a4a44', '#ffd0c890')), 'bubble_warn'),
      render(tall, 16, 16, prep(tint('#c85a10e0', '#fff2c8', '#ffd04a66', '#fff6d8a0')), 'bubble_warn'),
    ]);

    const small = (n, glint) => put(place(disc(n, n, 3), 16, 16, (16 - n) >> 1, (16 - n) >> 1), glint, (16 - n) / 2 + 3, (16 - n) / 2 + 3);
    sprite('bubble_shot', 16, 16, BUB_PAL, [small(8, G('w')), small(12, G('ww\nw')), bubbleBase(15, 15)], none);

    // a dark navy outer ring (G11) and a bold stage-coloured rim; the fill is faint so the enemy shows through
    const full = put(disc(16, 16, 2), BUB_SHINE_FLAT);
    const overlay = (rim, fill, glint) => ({ o: NAVY, r: rim, f: fill, g: glint, w: '#ffffff' });
    addSprite('trap_overlay', 16, 16, [
      overlay('#8cecff', '#4ccaf624', '#d6fcff80'),
      overlay('#ffd83a', '#ffd83a2c', '#fff8c880'),
      overlay('#ff5646', '#ff3a3a36', '#ffc8c080'),
    ].map((pal) => render(full, 16, 16, prep(pal), 'trap_overlay')));
    // special bubbles: tinted bubble + a 8x10 icon with its own dark outline, 2 wobble/pulse frames
    const specials = [
      ['thunder', tint('#9a6a00e0', '#fff27a', '#ffe04046', '#fffbd090'), ICON_BOLT, '#7a4a00',
        [{ y: '#ffe23a' }, { y: '#ffffff' }]],

  // 4. ENEMIES.  Each has 4 move frames, a hand-drawn trapped pose (2 frames, 12x12 centred in 16x16),
  //    a die pose (rotated x4) and action poses. "Angry" = the same finished grids in a crimson palette (G4),
  //    plus two steam puffs above the head that rise in alternating phases (a cue that does not rely on hue).
  //    Eye keys: w sclera, e pupil, c glint, V lid / v brow (white / skin colour when calm, dark when angry).
  // ===================================================================================================
  /** Shared angry body ramp (crimson / orange-red, dark shading) - every *_ANGRY palette extends it. */
  const ANGRY_BODY = { m: '#e0201c', l: '#ff6a3a', d: '#7a0c18', c: '#ffb48a' };
  /** Angry eyes: dark sockets with glowing yellow pupils. */
  const ANGRY_EYES = { w: '#4a0818', W: '#4a0818', e: '#ffe23a', E: '#ffe23a', c: '#ffffff', g: '#4a0818', V: '#4a0818', v: '#4a0818' };
  const STEAM_PAL = { z: '#ffffff' };
  const STEAM = [G('.zz\nzzz'), G('.z.\nzzz'), G('z.z\n.z.'), G('z..\n..z')];
  /**
   * Steam for angry sprites: one puff per anchor [x, y] (y = base row of the freshest puff), two frames out of phase,
   * each puff grows, rises one row per phase and breaks up. A dark ring keeps white puffs readable on pale tiles.
   */
  function addSteam(grids, anchors) {
    return grids.map((g, k) => {
      let layer = blank(16, 16);
      anchors.forEach(([x, y], i) => { const ph = (k + 2 * i) % 4; layer = put(layer, STEAM[ph], x, y - ph); });
      const ring = outlineGrid(layer, 'o').map((r, y) => r.split('').map((ch, x) => (ch === 'o' && g[y][x] === '.' ? 'o' : '.')).join(''));
      return put(put(g, ring), layer);
    });
  }

  // ---- Jellop: jellyfish, diagonal flyer (dome half-grid mirrored, tentacles swayed per frame) --------------
  const JELLY_PAL = { m: '#b66cf2', l: '#ecd2ff', d: '#7a3fc0', w: '#ffffff', e: '#2a1347', t: '#ff9ad8', T: '#d85aa8', v: '#b66cf2' };

  const JELLY_HALF = G(`

    ..lmmwem
    ..lmmeem
    ..lmmmme
    ..dddddd`);
  const JELLY_SKIP = 'tT';
  function jellyFrame(phase, dy, len = 6) {
    let g = put(blank(16, 16), sym(JELLY_HALF), 0, dy);
    [3, 6, 9, 12].forEach((bx, k) => {
      for (let i = 0; i < len; i++) {
        const y = 9 + dy + i;

        // neighbouring strands sway in opposite phase; the sway grows towards the tip
        const x = bx + Math.round(Math.sin(phase + i * 0.9 + (k % 2) * Math.PI) * Math.min(1, i / 2));
        g = put(g, [i >= len - 2 ? 'T' : (i % 2 ? 'T' : 't')], x, y);
      }
    });

  }

  /** Tapered arm along a polyline: returns a 48 x 48 grid of m, lit edge l, shade d, suckers u. */
  function arm(pts, w0, w1) {
    const g = Array.from({ length: 48 }, () => Array(48).fill('.'));
    const samples = 80;
    const path = [];
    const lenOf = (i) => Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    const total = pts.slice(0, -1).reduce((a, _, i) => a + lenOf(i), 0);
    for (let k = 0; k <= samples; k++) {
      let d = (k / samples) * total, i = 0;
      while (i < pts.length - 2 && d > lenOf(i)) { d -= lenOf(i); i++; }
      const f = Math.min(1, d / lenOf(i));
      path.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f, k / samples]);
    }
    for (const [px, py, t] of path) {
      const r = (w0 + (w1 - w0) * t) / 2;
      for (let y = Math.floor(py - r); y <= Math.ceil(py + r); y++) for (let x = Math.floor(px - r); x <= Math.ceil(px + r); x++) {
        if (x >= 0 && y >= 0 && x < 48 && y < 48 && Math.hypot(x - px, y - py) <= r) g[y][x] = 'm';
      }
    }
    const at = (x, y) => (x >= 0 && y >= 0 && x < 48 && y < 48 ? g[y][x] : '.');
    const out = g.map((r) => r.slice());
    for (let y = 0; y < 48; y++) for (let x = 0; x < 48; x++) {
      if (g[y][x] !== 'm') continue;
      if (at(x - 1, y) === '.' || at(x, y - 1) === '.') out[y][x] = 'l';
      if (at(x + 1, y) === '.' || at(x, y + 1) === '.') out[y][x] = 'd';
    }
    for (let k = 18; k < samples - 8; k += 14) {            // suckers along the underside of the arm
      const [px, py] = path[k];
      const x = Math.round(px), y = Math.round(py);
      if (out[y][x] === 'm' || out[y][x] === 'l') out[y][x] = 'u';
    }
    return out.map((r) => r.join(''));
  }
  const unionArms = (list) => list.reduce((acc, g) => put(acc, g), blank(48, 48));
  const mirrorWhole = (g) => g.map((r) => r.split('').reverse().join(''));

  let krakenStatic = null;                                  // dome + crown + face, shared by both frames
  function krakenFrame(variant) {
    if (!krakenStatic) {
      let st = put(blank(48, 48), krakenDome());
      st = put(st, sym(KR_CROWN_HALF), 0, 0);
      st = put(st, KR_EYE_L, 9, 13);

   * caller draws it at x - pad / y - pad; the glyph cells stay on the 8 px grid). A drop shadow is only added

      if (rim) for (const [ox, oy] of OFF8) g.drawImage(rim, sx, 0, 8, 8, dx + ox * scale, pad + oy * scale, px, px);

    // the silhouette colour is pal[4]; for the dark blue-slate themes (ship, temple) it is lifted towards white (alpha stays <= 0.12), kelp a little
    const lift = [0, 0.25, 0.55, 0, 0, 0.55][themeOf(idx)], layers = [];
    const silhouette = rgbOf(pal[4]).map((c) => c + (255 - c) * lift);
    const R = U.rng(idx * 7919 + 101);
    BG_PAINTERS[themeOf(idx)](R, (alpha, rgb) => { const m = new Uint8Array(BGW * BGH); layers.push({ m, a: Math.min(0.12, alpha * 1.25), rgb: rgb || silhouette }); return m; });
    const mirror = variantOf(idx) % 2 === 1;                              // every other variant is mirrored: more layouts
    for (const { m, a, rgb } of layers) {
      if (mirror) for (let y = 0; y < BGH; y++) for (let x = 0; x < BGW >> 1; x++) { const i0 = y * BGW + x, i1 = y * BGW + BGW - 1 - x, tmp = m[i0]; m[i0] = m[i1]; m[i1] = tmp; }
      for (let p = 0; p < m.length; p++) if (m[p]) { const i = p * 4; d[i] += (rgb[0] - d[i]) * a; d[i + 1] += (rgb[1] - d[i + 1]) * a; d[i + 2] += (rgb[2] - d[i + 2]) * a; }
    }
    const cv = mk(BGW, BGH);
    cv.getContext('2d').putImageData(img, 0, 0);
    return (bgCache[idx] = cv);
  }

  // ===================================================================================================
  // 9. LOGO: puffy bubble letters. Each letter is a stroke skeleton swept with a round brush (R px), turned
  //    into a pixel mask, then outlined (2 px), bevelled (lit top-left / shaded bottom-right) and filled
  //    with a dithered pink -> aqua gradient. Wobble + a sweeping shine are applied while drawing.
  // ===================================================================================================
  const LOGO_UNIT = 4.0, LOGO_R = 3.4, LOGO_OUT = 2, LOGO_PAD = 5;
  const ring = (cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2, n = 28) => Array.from({ length: n + 1 }, (_, i) => {
    const a = a0 + ((a1 - a0) * i) / n;
    return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry];
  });
  const LOGO_GLYPHS = {
    F: { w: 3.1, strokes: [[[0, 0], [0, 5.6]], [[0, 0], [3.1, 0]], [[0, 2.8], [2.4, 2.8]]] },
    I: { w: 2.2, strokes: [[[1.1, 0], [1.1, 5.6]], [[0, 0], [2.2, 0]], [[0, 5.6], [2.2, 5.6]]] },
    Z: { w: 3.3, strokes: [[[0, 0], [3.3, 0], [0, 5.6], [3.3, 5.6]]] },
    '&': { w: 4.3, strokes: [ring(1.6, 1.25, 1.1, 1.15), ring(1.8, 4.0, 1.8, 1.55), [[2.7, 3.0], [4.2, 5.6]]] },
    P: { w: 3.1, strokes: [[[0, 0], [0, 5.6]], [[0, 0], [2.2, 0], [3.1, 0.8], [3.1, 2.0], [2.2, 2.8], [0, 2.8]]] },
    O: { w: 3.3, strokes: [ring(1.65, 2.8, 1.65, 2.8, 0, Math.PI * 2, 32)] },
  };
  const LOGO_TEXT = 'FIZZ & POP';
  const LOGO_GAP = 2, LOGO_SPACE = 10;
  const LOGO_STOPS = [[0, [255, 92, 168]], [0.38, [214, 110, 255]], [0.68, [90, 184, 255]], [1, [96, 246, 232]]];
  const LOGO_GOLD = [255, 226, 107], LOGO_DEEP = [84, 36, 150];
  let logo = null;            // { letters: [{ch, x, sx, w, h}], width, fill, mask, shadow (3 strips of all letters) }
  let logoScratch = null;

  const logoGradient = (tt, out) => {
    for (let i = 1; i < LOGO_STOPS.length; i++) {
      if (tt <= LOGO_STOPS[i][0] || i === LOGO_STOPS.length - 1) {
        const [t0, c0] = LOGO_STOPS[i - 1], [t1, c1] = LOGO_STOPS[i];
        const k = Math.max(0, Math.min(1, (tt - t0) / (t1 - t0)));
        out[0] = c0[0] + (c1[0] - c0[0]) * k; out[1] = c0[1] + (c1[1] - c0[1]) * k; out[2] = c0[2] + (c1[2] - c0[2]) * k;
        return;
      }
    }
  };

  function buildLogo() {
    const items = [];
    let x = 0, sheetW = 0;
    const H = Math.ceil(5.6 * LOGO_UNIT + LOGO_R * 2) + LOGO_OUT * 2 + 1;
    for (const ch of LOGO_TEXT) {
      if (ch === ' ') { x += LOGO_SPACE; continue; }
      const gl = LOGO_GLYPHS[ch];
      const w = Math.ceil(gl.w * LOGO_UNIT + LOGO_R * 2) + LOGO_OUT * 2 + 1;
      items.push({ ch, gl, x, sx: sheetW, w, h: H });
      x += w - LOGO_OUT + LOGO_GAP;
      sheetW += w;
    }
    const total = x - LOGO_GAP + LOGO_OUT;
    const fillImg = new ImageData(sheetW, H), maskImg = new ImageData(sheetW, H), shImg = new ImageData(sheetW, H);
    const df = fillImg.data, dm = maskImg.data, ds = shImg.data;
    const bayer = [[0, 2], [3, 1]];
    const RO = LOGO_R + LOGO_OUT, col = [0, 0, 0];
    for (const it of items) {
      const { gl, w, h, sx } = it;
      const mask = new Uint8Array(w * h), outer = new Uint8Array(w * h);
      const ox = LOGO_OUT + LOGO_R, oy = LOGO_OUT + LOGO_R;
      // 1) sweep a round brush along the skeleton: mask (R) and outline mask (R + 2)
      for (const pts of gl.strokes) {
        for (let k = 0; k + 1 < pts.length; k++) {
          const [x0, y0] = pts[k], [x1, y1] = pts[k + 1];
          const n = Math.ceil(Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0)) * LOGO_UNIT * 0.8) + 1;
          for (let i = 0; i <= n; i++) {
            const px = ox + (x0 + ((x1 - x0) * i) / n) * LOGO_UNIT, py = oy + (y0 + ((y1 - y0) * i) / n) * LOGO_UNIT;
            for (let yy = Math.max(0, Math.floor(py - RO)); yy <= Math.min(h - 1, Math.ceil(py + RO)); yy++) {
              for (let xx = Math.max(0, Math.floor(px - RO)); xx <= Math.min(w - 1, Math.ceil(px + RO)); xx++) {
                const d2 = (xx - px) * (xx - px) + (yy - py) * (yy - py);
                if (d2 <= (LOGO_R + 0.2) * (LOGO_R + 0.2)) mask[yy * w + xx] = 1;
                if (d2 <= (RO + 0.2) * (RO + 0.2)) outer[yy * w + xx] = 1;
              }
            }
          }
        }
      }
      const m = (xx, yy) => (xx >= 0 && yy >= 0 && xx < w && yy < h ? mask[yy * w + xx] : 0);
      // 2) colour: gradient over the whole logo ('&' in gold), dithered vertical shading, bevel rims
      for (let yy = 0; yy < h; yy++) {
        for (let xx = 0; xx < w; xx++) {
          const p = yy * w + xx, i = (yy * sheetW + sx + xx) * 4;
          if (outer[p]) { ds[i] = 10; ds[i + 1] = 4; ds[i + 2] = 30; ds[i + 3] = 255; }
          if (!mask[p]) {
            if (outer[p]) { df[i] = 27; df[i + 1] = 16; df[i + 2] = 51; df[i + 3] = 255; }
            continue;
          }
          dm[i + 3] = 255;
          if (it.ch === '&') { col[0] = LOGO_GOLD[0]; col[1] = LOGO_GOLD[1]; col[2] = LOGO_GOLD[2]; } else logoGradient((it.x + xx) / total, col);
          const lvl = ((yy - LOGO_OUT) / (h - LOGO_OUT * 2)) * 5 + (bayer[yy & 1][xx & 1] / 4 - 0.375) * 0.8;
          const toWhite = lvl < 1, k = toWhite ? 0.28 : lvl < 3.2 ? 0 : lvl < 4.2 ? 0.22 : 0.42;
          const lit = !m(xx - 2, yy - 2) || !m(xx - 1, yy - 1);
          const shaded = !lit && (!m(xx + 2, yy + 2) || !m(xx + 1, yy + 1));
          for (let c = 0; c < 3; c++) {
            let v = col[c];
            v += ((toWhite ? 255 : LOGO_DEEP[c]) - v) * k;
            if (lit) v += (255 - v) * 0.62; else if (shaded) v += (LOGO_DEEP[c] - v) * 0.3;
            df[i + c] = v;
          }
          df[i + 3] = 255;
        }
      }
    }
    const strip = (img) => { const c = mk(sheetW, H); c.getContext('2d').putImageData(img, 0, 0); return c; };
    logo = { letters: items, width: total, height: H, fill: strip(fillImg), mask: strip(maskImg), shadow: strip(shImg) };
    logoScratch = mk(items[0].w + 4, H + 4);
  }

  /** Logo with its top edge at y, horizontally centred on cx. t = frame counter (animation). */
  function drawLogo(ctx, cx, y, t) {
    ensure();
    if (!logo) buildLogo();
    const x0 = Math.round(cx - logo.width / 2);
    const smooth = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    const prevAlpha = ctx.globalAlpha;
    const bandX = ((t * 1.7) % (logo.width + 90)) - 45;           // diagonal shine sweeping across the logo
    const sg = logoScratch.getContext('2d');
    for (let i = 0; i < logo.letters.length; i++) {
      const L = logo.letters[i];
      const wob = Math.round(Math.sin(t / 13 + i * 0.75) * 2);
      const lx = x0 + L.x, ly = y + LOGO_PAD + wob;
      ctx.globalAlpha = prevAlpha * 0.5; ctx.drawImage(logo.shadow, L.sx, 0, L.w, L.h, lx + 2, ly + 3, L.w, L.h); ctx.globalAlpha = prevAlpha;
      ctx.drawImage(logo.fill, L.sx, 0, L.w, L.h, lx, ly, L.w, L.h);
      const rel = bandX - L.x;
      if (rel > -14 && rel < L.w + L.h + 14) {                    // shine: white diagonal band clipped to the letter
        sg.clearRect(0, 0, logoScratch.width, logoScratch.height);
        sg.fillStyle = 'rgba(255,255,255,0.75)';
        sg.beginPath(); sg.moveTo(rel + L.h, 0); sg.lineTo(rel + L.h + 6, 0); sg.lineTo(rel + 6, L.h); sg.lineTo(rel, L.h); sg.closePath(); sg.fill();
        sg.globalCompositeOperation = 'destination-in'; sg.drawImage(logo.mask, L.sx, 0, L.w, L.h, 0, 0, L.w, L.h); sg.globalCompositeOperation = 'source-over';
        ctx.drawImage(logoScratch, lx, ly);
      }
    }
    // three little bubbles drifting up from the logo's top edge
    for (let k = 0; k < 3; k++) {
      const ph = ((t * 0.45 + k * 43) % 130) / 130;
      const bx = x0 + [40, 112, logo.width - 36][k] + Math.round(Math.sin(t / 17 + k * 2) * 3);
      draw(ctx, 'bubble_shot', k % 2 ? 1 : 2, bx - 8, y + 4 - ph * 26 - 8, { alpha: Math.min(1, (1 - ph) * 1.6) });
    }
    ctx.imageSmoothingEnabled = smooth;
  }

  // ===================================================================================================
  // 10. SHEET (debug): every sprite x every frame, labelled, on a dark dotted grid
  // ===================================================================================================
  function sheet() {
    ensure();
    const W = 640, PADX = 4;
    const cells = ORDER.map((n) => ({ n, w: REG[n].w, h: REG[n].h, f: REG[n].n }));
    let x = PADX, y = 4, rowH = 0;
    const placed = cells.map((c) => {
      const cw = Math.max(c.f * (c.w + 2), textWidth(c.n)) + 6;
      const ch = c.h + 12;
      if (x + cw > W) { x = PADX; y += rowH + 4; rowH = 0; }
      const p = { c, x, y };
      x += cw; rowH = Math.max(rowH, ch);
      return p;
    });
    const cv = mk(W, y + rowH + 8);
    const g = cv.getContext('2d');
    g.fillStyle = '#10101c'; g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#1a1a2c';
    for (let yy = 0; yy < cv.height; yy += 8) for (let xx = 0; xx < cv.width; xx += 8) g.fillRect(xx, yy, 1, 1);
    for (const { c, x: px, y: py } of placed) {
      text(g, c.n, px, py, '#9ab4d0', { shadow: false });
      for (let f = 0; f < c.f; f++) draw(g, c.n, f, px + f * (c.w + 2), py + 10);
    }
    return cv;
  }

  // ===================================================================================================
  // @@ART-HERE@@
  // ===================================================================================================

  // ===================================================================================================
  // N. Public API
  // ===================================================================================================
  const timings = {};
  const timed = (name, fn) => { const t0 = performance.now(); fn(); timings[name] = +(performance.now() - t0).toFixed(1); };
  function buildAll() {
    timed('players', buildPlayers);
    timed('bubbles', buildBubbles);
    timed('effects', buildEffects);
    timed('enemies', buildEnemies);
    timed('items', buildItems);
    lazyGroup([['kraken', 48, 48, 2], ['kraken_angry', 48, 48, 2], ['kraken_trapped', 64, 64, 1], ['moonpearl', 32, 32, 2]], buildKraken);
  }
  function buildPlayers() {
    const F = playerFrame;
    const idle0 = F({});
    const idle1 = F({ eyes: EYE_BLINK, frondDy: 1, tail: TAIL.mid });
    const walk = [
      F({ body: BODY_PARTS.contact, dy: 1, tail: TAIL.up }),
      F({ body: BODY_PARTS.passR, tail: TAIL.mid, frondDy: -1 }),
      F({ body: BODY_PARTS.contact, dy: 1, tail: TAIL.mid, frondDy: 1 }),
      F({ body: BODY_PARTS.passL, tail: TAIL.mid, frondDy: -1 }),
    ];
    const jump = F({ body: BODY_PARTS.tuck, mouth: M_O, mouthX: 10, tail: TAIL.up, frondDy: 1 });
    const fall = F({ body: BODY_PARTS.dangle, mouth: M_O, mouthX: 10, tail: TAIL.down, frondDy: -1 });
    const shoot = [
      F({ cheeks: true, eyes: EYE_SQUINT, mouth: M_PUCKER, mouthX: 10, body: BODY_PARTS.shoot }),
      F({ eyes: EYE_SQUINT, mouth: M_O, mouthX: 10, body: BODY_PARTS.shoot, dy: 0 }),
    ];
    const hurt = F({ body: BODY_PARTS.flung, eyes: EYE_X, eyeX: [6, 10], eyeY: 5, mouth: M_WAVY, mouthX: 8, blush: false, frondDy: -1 });
    const stun = [
      F({ eyes: EYE_SPIRAL_A, eyeX: [6, 10], eyeY: 5, mouth: M_WAVY, mouthX: 8, blush: false, extra: [[G('y..y\n.y.y'), 5, -1]] }),
      F({ eyes: EYE_SPIRAL_B, eyeX: [6, 10], eyeY: 5, mouth: M_WAVY, mouthX: 8, blush: false, frondDy: 1, extra: [[G('.y.y\ny..y'), 5, -1]] }),
    ];
    const icon = G(`
      ........
      .oooooo.
      obllbbbo
      gbbbbbbg
      obebbebo
      gbbGGbbg
      .obbbbo.
      ..oooo..`);
    const rotDie = (g) => [g, rot90(g), rot90(rot90(g)), rot90(rot90(rot90(g)))];
    const fin = (grids) => grids.map((g) => outlineGrid(g, 'o', false, SKIP_FRILL));
    const sets = {
      idle: fin([idle0, idle1]), walk: fin(walk), jump: fin([jump]), fall: fin([fall]), shoot: fin(shoot),
      die: rotDie(fin([hurt])[0]), stun: fin(stun),
    };
    for (const [pre, pal] of [['p1', PAL_P1], ['p2', PAL_P2]]) {
      for (const k of Object.keys(sets)) spriteFinished(pre + '_' + k, 16, 16, pal, sets[k]);
      sprite(pre + '_icon', 8, 8, pal, [icon], { outline: false });
    }
  }

  function init() {
    if (initDone) return;
    initDone = true;
    timed('font', buildFont);
    buildAll();
    timed('logo', buildLogo);
  }

  const ensure = () => { if (!initDone) init(); };            // forgiving: drawing before init() just builds first
  const has = (name) => { ensure(); return name in REG; };
  const frames = (name) => (has(name) ? REG[name].n : 0);
  const size = (name) => (has(name) ? { w: REG[name].w, h: REG[name].h } : { w: 0, h: 0 });
  const warned = Object.create(null);

  function draw(ctx, name, frame, x, y, opts) {
    ensure();
    const s = REG[name];
    if (!s) {
      if (!warned[name]) { warned[name] = true; console.warn('GFX: unknown sprite ' + name); }
      ctx.fillStyle = '#f0f'; ctx.fillRect(Math.round(x), Math.round(y), 16, 16);
      return;
    }
    let f = Math.floor(frame) % s.n;
    if (!(f >= 0)) f = f < 0 ? f + s.n : 0;
    const o = opts || {};
    const cv = variant(s, !!o.flip, !!o.white);
    const a = o.alpha === undefined ? 1 : o.alpha;
    const sx = f * s.w;                                  // a flipped strip mirrors every frame in place
    if (a === 1) { ctx.drawImage(cv, sx, 0, s.w, s.h, Math.round(x), Math.round(y), s.w, s.h); return; }
    const prev = ctx.globalAlpha;
    ctx.globalAlpha = prev * a;
    ctx.drawImage(cv, sx, 0, s.w, s.h, Math.round(x), Math.round(y), s.w, s.h);
    ctx.globalAlpha = prev;
  }

  const _registry = () => (ensure(), ORDER).map((n) => ({ name: n, w: REG[n].w, h: REG[n].h, frames: REG[n].n }));
  const _lint = () => lintLog.slice();
  const _timings = () => Object.assign({}, timings);

  return { init, draw, frames, size, has, text, textWidth, levelCanvas, bgCanvas, theme, drawLogo, sheet, _registry, _lint, _timings };
})();


/* ===== 20_audio.js ===== */
/* FIZZ & POP — 20_audio.js
 * AUDIO: pure WebAudio chiptune synth + look-ahead sequencer + SFX bank.  Contract: SPEC §3.2 / §6, amended by FIXPLAN §0/§3 and FIXPLAN2 K7.
 *
 * ARCHITECTURE
 *  - Everything audible is built by voice functions that take (ctx, destination, time, params), so the very
 *    same code runs on the live AudioContext and on an OfflineAudioContext (AUDIO._renderOffline).
 *  - Signal path:  [track buses | sfx group]  ->  music/sfx bus -> master -> DynamicsCompressor (gentle glue: -14 dB, 2.5:1) ->
 *    soft-clip safety shaper (hard ceiling < 0.9) -> mute gain -> destination.  Lead notes also feed a
 *    ping-pong echo (light, tempo-synced) that returns into the music bus.
 *  - Sequencer: songs are tracker-like strings compiled lazily to a per-16th-step event table.  A
 *    setInterval (25 ms) pump schedules events HORIZON (0.28 s) ahead on AudioContext time.  The step clock is
 *    advanced one step at a time using the *current* tempo, so AUDIO.setTempo() takes effect on the next
 *    unscheduled step with no glitch.  Swing is a per-beat duration pattern (steps 0,1 long / 2,3 short).
 *  - Every playing track owns a gain "out" + voice buses and a registry of its source nodes; stopping a
 *    track fades it, stops its sources and disconnects it, so rapid switching never stacks tracks.
 *    Counters in `live` (voices / tracks / groups) are exposed through AUDIO._stats() for leak tests.
 *
 * SONG NOTATION (see songDefs())
 *  - Note strings: `c5/2 d#5 r/4 ...`  pitch = letter[#|b]octave (c4 = middle C = MIDI 60), `/n` = length in
 *    16th steps (default 2), `r` = rest, `|` = bar line (cosmetic, but validated: every bar must add up).
 *  - Chords: `| G | Em.Am7 | ...`  one bar per `|`; chords joined by `.` share the bar equally; `C/8` = explicit
 *    length in steps (used by jingles).  Qualities: '' m 7 m7 maj7 m7b5 dim sus 7sus 6 m6 5.
 *  - Bass / arp patterns: a cell of chord-relative symbols tiled across each chord.  1 root, 3 third, 5 fifth,
 *    7 seventh, 8 root+oct, a third+oct, c fifth+oct, e seventh+oct, 9 ninth, 6 sixth, 2 second, 4 fourth,
 *    b fifth (alias of 5).  `-` extends the previous note, `.` is a rest.  Bass roots live in MIDI 43..54 (G2..F#3).
 *  - Drum cells (16 chars/bar): k kick, s snare, x ghost snare, h hat, o open hat, t hi tom, u lo tom,
 *    c crash+kick, K kick+hat, S snare+hat.
 *  - Per-song options: `lift` (semitones added on every second pass of a loop: the same loop sounds different on its
 *    next hearing), `maxTempo` (cap for setTempo on that track), `mix` ({lead,harm,bass,drum} bus gains), `cfg` (voice
 *    overrides).  Per-section: `mix` ({lead,harm,bass,drum} multipliers, 0 = voice tacet: breakdowns / drum drop-outs).
 *
 * DESIGN CHOICES where the SPEC is silent
 *  - Calls before init(): sfx are dropped silently; music()/jingle() are remembered (a requested loop starts as
 *    soon as init() has created the context; a jingle called before init() just fires onEnd after its nominal
 *    length so game flow never stalls).  A jingle whose context never starts running (autoplay blocked) is
 *    force-finished by a wall-clock watchdog (paused time is not counted against it).
 *  - jingle(): onEnd fires when the jingle's timeline ends (once; JINGLE_END_LEAD = 40 ms early, so a loop requested from onEnd is
 *    still chained sample-accurately on the jingle's end line).  If the jingle is interrupted by another
 *    music()/jingle()/stopMusic() call its onEnd is dropped.  With {resume:true} the previous loop continues
 *    sample-accurately at the beginning of the bar it was in.  Jingles ignore setTempo().  A jingle starts at once; a loop it
 *    replaces is faded out over 150 ms under its attack (the old 40 ms fade chopped the phrase audibly).
 *  - music(name) while a jingle is playing does not cut the jingle: the requested loop is queued and starts sample-
 *    accurately when the jingle ends (same loop as the jingle's resume target = no-op), however late in the jingle it is requested
 *    (once the jingle's last notes are scheduled the loop is chained behind it at once).  The `start` jingle is 2.25 s (FIXPLAN2 K7:
 *    over before the 2.5 s round-1 intro), so Game's onEnd -> music(stage) lands on its end line.  music(name) while another
 *    LOOP is sounding is bar-aligned: the old loop plays to the end of its bar (a half bar / beat when a bar would take
 *    more than 1.6 s), then fades out over 0.2 s while the new loop starts sample-accurately on that line.  Asking for
 *    the sounding loop again cancels a pending switch.  music(name, {restart:true}) and stopMusic() act immediately.
 *  - setTempo is global state and persists across tracks (Game resets it to 1.0 at round start).
 *  - Mute is a master gain at the end of the chain plus "don't create nodes" in the scheduler; the timeline keeps
 *    running so jingle onEnd and loop positions stay right.
 *  - pause({suspend}): the scheduler stops at once and the music ducks out in ~60 ms.  suspend:true (default; blur / hidden
 *    tab): ready() turns false and the context is suspended 320 ms later (so a 'pause' blip played around the call is still
 *    heard).  suspend:false (manual pause screen): the context keeps running so menu sfx still play.  resume() undoes
 *    either, shifts every timeline by the time that passed (loops continue where they were, a half-played jingle plays
 *    out) and recovers a context that was suspended from outside.  sfx() are ignored while muted or suspended.
 *  - Failures: every scheduled event, the scheduler tick and every sfx are wrapped in try/catch.  A failing call costs
 *    that one sound; after FAULT_LIMIT (20) failing scheduler steps (sporadic ones heal after ~1 s of clean ticks) the music is
 *    switched off with a single console.warn; an sfx that fails 6 times is disabled.  Nothing ever throws into game code.
 *  - SFX voice limits steal the oldest instance of the same sound (pop x3, shoot x2, boss_hit x2 ...); a global
 *    source-node budget (MAX_VOICES) drops new SFX when exceeded.  Music is never dropped.
 *  - sfx options: {pitch: semitones, vol}.  `kill` is designed for pitch 0..+12 (Game: min(2*chain index, 12): a rising ladder).
 *    `clear` = round-clear stinger (<= 0.8 s).  boss_die has no chime tail (the clear_boss fanfare follows 1 s later).
 *  - Mix targets (verified by test/audio_analyze.mjs): music RMS -18..-20 dBFS, SFX calibrated PERCEPTUALLY: every non-quiet SFX
 *    sits on the same A-weighted active level (-19 dB, +-0.5), quiet ones (menu_move -9 dB, land -12 dB) below it; output peak
 *    <= 0.9 even with 18 SFX piled on the boss loop.  The per-SFX `trim` constants come from
 *    `node test/audio_analyze.mjs --apply-trims --target -19` (repeat until flat).
 *  - Non-contract debug extras: _info(name), _dump(name), _validate(), _stats(), _state(), _tap(), _seek(step); _renderOffline
 *    accepts a 3rd options argument {tempo, skip, sfx, noComp, noTrim, chunk, pitch, pass, vol} used by the tests only.
 */
const AUDIO = (() => {
  // ================================================================================================
  // names / constants
  // ================================================================================================
  const LOOPS = ['title', 'stage1', 'stage2', 'boss', 'entry', 'ending'];
  const JINGLES = ['start', 'extend', 'gameover', 'clear_boss'];
  const SFX_NAMES = ['jump', 'shoot', 'pop', 'trap', 'kill', 'bounce', 'food', 'powerup', 'item_appear',
    'letter', 'oneup', 'death', 'hurry', 'ghost', 'thunder', 'fire', 'water', 'freeze', 'bomb',
    'menu_move', 'menu_select', 'pause', 'boss_hit', 'boss_die', 'enemy_shot', 'spawn', 'land', 'clear'];

  const TICK_MS = 25;            // scheduler pump interval
  const HORIZON = 0.28;          // schedule this far ahead of AudioContext.currentTime (s); survives ~250 ms main-thread stalls
  const START_DELAY = 0.06;      // first step of a fresh track starts this far in the future
  const FADE_SWITCH = 0.04;      // fade used when a track is replaced at once (s)
  const FADE_XFADE = 0.2;        // fade-out of the old loop when a bar-aligned loop->loop switch lands (s)
  const SWITCH_MAX_WAIT = 1.6;   // a bar-aligned switch waits at most this long (s); longer bars fall back to half bars / beats
  const JINGLE_END_LEAD = 0.04;  // a jingle reports its end (onEnd) up to this early, so a loop requested from onEnd can still be chained on the line
  const FADE_JINGLE = 0.15;      // a jingle that replaces a sounding loop: the loop is faded out under the jingle's attack (no 40 ms chop)
  const PAUSE_SUSPEND_MS = 320;  // pause(): context is suspended this long after the music has ducked out
  const FAULT_LIMIT = 20;        // failing scheduler steps tolerated before the music is switched off for good
  const SFX_FAULT_LIMIT = 6;     // exceptions tolerated per sfx name before that sfx is disabled
  const STEPS_PER_BAR = 16;
  const OFFLINE_RATE = 44100;
  const OFFLINE_CHUNK = 2;       // seconds of music scheduled per slice in _renderOffline
  const MAX_VOICES = 90;         // global source-node budget; new SFX are dropped above this
  const MUSIC_LEVEL = 0.62, SFX_LEVEL = 1.5, MASTER_LEVEL = 0.95;
  const ECHO_FEEDBACK = 0.33, ECHO_SEND = 0.2;

  // ================================================================================================
  // small helpers
  // ================================================================================================
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const noop = () => {};
  const warned = {};
  function warnOnce(kind, name) {
    const k = kind + ':' + name;
    if (warned[k]) return;
    warned[k] = true;
    try { console.warn('AUDIO: unknown ' + kind + ' "' + name + '"'); } catch (e) { /* no console */ }
  }
  function safeCall(fn) { try { if (typeof fn === 'function') fn(); } catch (e) { /* user callback must not break audio */ } }

  // deterministic "random" start offsets into the noise buffer (reproducible offline renders)
  let nzState = 0x1234567;
  function nzReset() { nzState = 0x1234567; }
  function nzOffset() {
    nzState ^= nzState << 13; nzState >>>= 0;
    nzState ^= nzState >>> 17;
    nzState ^= nzState << 5; nzState >>>= 0;
    return (nzState % 100000) / 100000;     // 0..1
  }

  // ================================================================================================
  // live counters + source registries (leak accounting)
  // ================================================================================================
  const live = { voices: 0, tracks: 0, groups: 0, resyncs: 0 };
  let REG = null;                 // registry that receives every source node created right now

  function makeRegistry(onIdle) {
    const set = new Set();
    const r = {
      set, onIdle,
      add(src) { set.add(src); live.voices++; src.onended = () => r.drop(src); },
      drop(src) { if (set.delete(src)) { live.voices--; if (!set.size && r.onIdle) r.onIdle(); } },
      stopAll(when) { for (const s of set) { try { s.stop(when); } catch (e) { /* not started / already stopped */ } } },
      clear() { r.onIdle = null; for (const s of Array.from(set)) r.drop(s); },
    };

  }

  // ================================================================================================
  // per-context caches: noise buffer, pulse PeriodicWaves, bass wave
  // ================================================================================================
  const envs = new WeakMap();
  function env(ctx) {
    let e = envs.get(ctx);
    if (!e) {
      const len = Math.floor(ctx.sampleRate * 2);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      const rnd = U.rng(20240607);
      for (let i = 0; i < len; i++) d[i] = rnd.next() * 2 - 1;

      envs.set(ctx, e);

  }
  /** Pulse wave with the given duty (fraction of the period spent high). Fourier series of a rectangular pulse. */
  function pulseWave(ctx, duty) {
    const e = env(ctx);
    const key = String(duty);
    if (!e.pulse[key]) {
      const N = 48;
      const re = new Float32Array(N + 1), im = new Float32Array(N + 1);
      for (let n = 1; n <= N; n++) {
        re[n] = Math.sin(2 * Math.PI * n * duty) / (n * Math.PI);
        im[n] = (1 - Math.cos(2 * Math.PI * n * duty)) / (n * Math.PI);
      }
      e.pulse[key] = ctx.createPeriodicWave(re, im);
    }
    return e.pulse[key];
  }
  /**
   * Triangle core plus a deliberately strong 2nd-4th harmonic set (h2 .30, h3 .20, h4 .12 of the fundamental) so the bass
   * line still speaks on phone / laptop speakers that roll off below ~150-300 Hz (QA A9): the harmonics sit at 200-800 Hz.
   */
  function bassWave(ctx) {
    const e = env(ctx);
    if (!e.bass) {
      const N = 16;
      const re = new Float32Array(N + 1), im = new Float32Array(N + 1);
      for (let n = 1; n <= N; n++) {
        const odd = n % 2 === 1;
        const tri = odd ? (((n - 1) / 2) % 2 === 0 ? 1 : -1) / (n * n) : 0;
        im[n] = n === 1 ? 1 : n === 2 ? 0.30 : n === 3 ? 0.20 : n === 4 ? 0.12 : tri;
      }

    }

  }
  function setWave(ctx, osc, w) {
    if (typeof w === 'number') osc.setPeriodicWave(pulseWave(ctx, w));
    else if (w === 'bass') osc.setPeriodicWave(bassWave(ctx));
    else osc.type = w === 'saw' ? 'sawtooth' : (w || 'sine');
  }
  function noiseSource(ctx, t, dur) {
    const s = reg(ctx.createBufferSource());
    s.buffer = env(ctx).noise;
    s.loop = true;
    s.start(t, nzOffset() * 1.5);
    s.stop(t + dur);
    return s;
  }

  // ================================================================================================
  // synth primitives (used by SFX; parameterised by ctx / destination / time)
  // ================================================================================================
  /**
   * tone: oscillator with an optional exponential pitch path and an amplitude envelope.
   *  o.w   'sine'|'triangle'|'saw'|'bass'|number (pulse duty)       o.f / o.f2   start / end Hz
   *  o.pts [[seconds, Hz], ...] explicit pitch path (overrides f/f2) o.d          total duration (s)
   *  o.v   peak gain      o.a attack (s)     o.sh 'exp' (default, decaying) | 'hold' (flat, then release o.r)
   *  o.at  start offset   o.vib [Hz, cents, delay s] vibrato (detune curve)   o.fix true = ignore the sfx pitch option
   *  P     {f: pitch factor, v: volume factor} from the sfx() options
   */
  function tone(ctx, dest, t, o, P) {
    const pf = P && !o.fix ? P.f : 1, pv = P ? P.v : 1;
    t += o.at || 0;
    const d = o.d;
    const osc = reg(ctx.createOscillator());
    try {
      setWave(ctx, osc, o.w);
      const pts = o.pts || [[0, o.f], [d, o.f2 || o.f]];
      osc.frequency.setValueAtTime(pts[0][1] * pf, t);
      for (let i = 1; i < pts.length; i++) osc.frequency.exponentialRampToValueAtTime(pts[i][1] * pf, t + pts[i][0]);
      if (o.vib && d > o.vib[2] + 0.04) vibrato(osc, t + o.vib[2], d - o.vib[2], o.vib[0], o.vib[1]);
      const g = ctx.createGain();
      const v = o.v * pv, a = Math.min(o.a === undefined ? 0.004 : o.a, d * 0.5);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(v, t + a);
      if (o.sh === 'hold') {
        const r = Math.min(o.r === undefined ? 0.03 : o.r, d - a);
        g.gain.setValueAtTime(v, t + d - r);
        g.gain.linearRampToValueAtTime(0, t + d);
      } else {
        g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      }

      osc.start(t); osc.stop(t + d + 0.02);

  }
  /** Sine vibrato on osc.detune via one value curve (cheap, no LFO nodes). Depth ramps in over ~0.15 s. */
  function vibrato(osc, t0, dur, hz, cents) {
    if (!osc.detune) return;                                // very old engines: no detune AudioParam -> no vibrato
    const n = Math.max(16, Math.ceil(dur * 60));
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * dur;
      curve[i] = Math.sin(2 * Math.PI * hz * x) * cents * Math.min(1, x / 0.15);

  }
  /**
   * noise: filtered white noise burst.  o.ft filter type, o.f / o.f2 centre/cutoff sweep, o.q, o.d, o.v, o.a, o.at
   */
  function noise(ctx, dest, t, o, P) {
    const pf = P && !o.fix ? P.f : 1, pv = P ? P.v : 1;

    const d = o.d;
    const src = noiseSource(ctx, t, d + 0.02);

    f.frequency.setValueAtTime(o.f * pf, t);

    f.Q.value = o.q === undefined ? 0.8 : o.q;
    const g = ctx.createGain();
    const v = o.v * pv, a = Math.min(o.a === undefined ? 0.003 : o.a, d * 0.5);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0008, t + d);

  }

  function bell(ctx, dest, t, o, P) {
    tone(ctx, dest, t, { w: 'sine', f: o.f, d: o.d, v: o.v, at: o.at, fix: o.fix }, P);
    tone(ctx, dest, t, { w: 'sine', f: o.f * 2.01, d: o.d * 0.7, v: o.v * 0.33, at: o.at, fix: o.fix }, P);
    tone(ctx, dest, t, { w: 'sine', f: o.f * 3.97, d: o.d * 0.4, v: o.v * 0.14, at: o.at, fix: o.fix }, P);

  /** Kit handed to sfx definitions: all calls are relative to the sfx start time.  k.semi = the pitch option (semitones). */
  function kit(ctx, dest, t, P) {

      semi: P ? Math.round(12 * Math.log2(P.f)) : 0,
      tone: (o) => tone(ctx, dest, t, o, P),
      noise: (o) => noise(ctx, dest, t, o, P),
      bell: (o) => bell(ctx, dest, t, o, P),
      /** run of equal-length tones: freqs[], spacing `step`, template o */
      seq: (freqs, step, o) => freqs.forEach((f, i) => tone(ctx, dest, t,
        Object.assign({}, o, { f, f2: f, at: (o.at || 0) + i * step, d: o.d || step * 1.4 }), P)),

  // SFX bank
  // ================================================================================================
  // trim: per-sfx loudness calibration -- fitted on the A-WEIGHTED active level (target -19 dB) by `node test/audio_analyze.mjs

  // max: concurrent instances.  quiet: true = 9 dB below the target, a number = that many dB below (land: 12).  lvl: dB ABOVE the target for
  // very short, fast-decaying sounds (the ear integrates over ~100-200 ms, so a 100 ms blip needs a little more level than a sustained
  // sound of the same short-window level: boss_hit +3, enemy_shot +1.5, jump / pop +1).
  // Energy plan: the heavy sounds (thunder / bomb / boss_hit / boss_die / land) keep their weight in a 200-2500 Hz band plus a short
  // sub tail, so they survive laptop and phone speakers (QA A2).
  const SFX = {
    jump: { max: 2, trim: 2.38, lvl: 1, fn(k) {              // springy chirp, kept above ~350 Hz so it carries on small speakers

      k.tone({ w: 'sine', f: 200, f2: 450, d: 0.14, v: 0.32 });

    shoot: { max: 2, trim: 1.27, fn(k) {            // soft bubble blow: two rising bloops + airy puff

      k.tone({ w: 'sine', f: 640, f2: 1500, d: 0.09, v: 0.35, at: 0.045 });

    pop: { max: 3, trim: 1.22, lvl: 1, fn(k) {               // tiny click + falling blip

    trap: { max: 2, trim: 0.97, fn(k) {              // enemy gets sealed: two-stage rising "bwip" + whoosh

      k.tone({ w: 'triangle', f: 780, f2: 1560, d: 0.11, v: 0.45, at: 0.07 });
      k.tone({ w: 0.25, f: 1560, f2: 2300, d: 0.07, v: 0.2, at: 0.13 });
      k.noise({ ft: 'bandpass', f: 900, f2: 2600, q: 1, d: 0.16, v: 0.14 });
    } },
    kill: { max: 3, trim: 0.9, fn(k) {              // rising staircase + crack + thump; the pitch option climbs with the chain

      k.seq([523, 659, 784, 1047], 0.04, { w: 0.25, v: 0.42 * vs, d: 0.075 });
      k.noise({ ft: 'bandpass', f: 2600, q: 0.8, d: 0.07, v: 0.28 * vs });

    powerup: { max: 1, trim: 0.78, fn(k) {           // fast E-minor-pentatonic run into a shimmering stab (all notes inside the music keys)

    item_appear: { max: 1, trim: 0.52, fn(k) {       // bloop + three twinkles

    letter: { max: 2, trim: 0.44, fn(k) {            // rising bell triad

    oneup: { max: 1, trim: 0.79, fn(k) {             // jubilant arpeggio + held trill
