<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fizz &amp; Pop</title>
<style>
  /* ABYSS GLOW page chrome (v2). Colours are tokens on :root. The game canvas itself is always near-black; the page around it follows
     the light/dark theme (SPEC 2.5): dark = the abyss palette (void, cyan hairlines, soft glow), light = a pale page around the dark
     canvas with dark-navy ink on the buttons. Dark values are declared twice on purpose: once for the OS preference (unless the host
     forces light) and once for a forced dark. color-scheme follows the tokens: light on :root, dark inside both dark blocks (Ut3). */
  :root {
    --page-bg: #e9eef6;
    --page-fg: #0b1a33;
    --page-muted: #4a5a7a;
    --frame: #0b1a33;
    --frame-glow: rgba(11, 26, 51, 0.30);
    --key-bg: #ffffff;
    --key-fg: #0b1a33;
    --key-edge: #aeb9d2;
    --btn-bg: #ffffff;
    --btn-fg: #0b1a33;
    --btn-edge: #7d8fb6;
    --btn-glow: rgba(11, 26, 51, 0.0);
    --btn-on: #3cf2ff;
    --btn-on-fg: #04101f;
    --cta-edge: rgba(60, 242, 255, 0.9);
    --veil: rgba(2, 4, 12, 0.5);
    --veil-fg: #eaffff;
    --btn: clamp(44px, calc((100vw - 64px) / 4), 92px);   /* fallback before Main's fit() sets --btn-w/--btn-h (the same formula) */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #05070f;
      --page-fg: #d6f6ff;
      --page-muted: #7fb0c6;
      --frame: rgba(60, 242, 255, 0.42);
      --frame-glow: rgba(60, 242, 255, 0.16);
      --key-bg: rgba(9, 20, 38, 0.92);
      --key-fg: #bff4ff;
      --key-edge: rgba(60, 242, 255, 0.34);
      --btn-bg: rgba(6, 14, 30, 0.84);
      --btn-fg: #bff4ff;
      --btn-edge: rgba(60, 242, 255, 0.5);
      --btn-glow: rgba(60, 242, 255, 0.22);
      --btn-on: rgba(60, 242, 255, 0.26);
      --btn-on-fg: #ffffff;
      --veil: rgba(2, 4, 12, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #05070f;
    --page-fg: #d6f6ff;
    --page-muted: #7fb0c6;
    --frame: rgba(60, 242, 255, 0.42);
    --frame-glow: rgba(60, 242, 255, 0.16);
    --key-bg: rgba(9, 20, 38, 0.92);
    --key-fg: #bff4ff;
    --key-edge: rgba(60, 242, 255, 0.34);
    --btn-bg: rgba(6, 14, 30, 0.84);
    --btn-fg: #bff4ff;
    --btn-edge: rgba(60, 242, 255, 0.5);
    --btn-glow: rgba(60, 242, 255, 0.22);
    --btn-on: rgba(60, 242, 255, 0.26);
    --btn-on-fg: #ffffff;
    --veil: rgba(2, 4, 12, 0.5);
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  /* No pinch / double-tap zoom, no pull-to-refresh or rubber-banding, no text selection (Ut1).
     pan-x pan-y (instead of none) keeps a degenerate, overflowing frame scrollable. */
  html, body {
    touch-action: pan-x pan-y; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  html { overflow-x: hidden; }
  body {
    background: var(--page-bg);
    color: var(--page-fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 8px 16px;                 /* 16 px side gutters, also on a 360 px phone */
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- stage: canvas + legend. margin-block:auto centres it vertically but, unlike justify-content:center,
     never pushes an overflowing stage above the top edge where it could not be scrolled to (Ut4). ---- */
  #stage {
    flex: 0 0 auto; width: 100%; margin-block: auto;
    display: flex; flex-direction: column; align-items: center;
  }
  /* Phones in portrait (K2): the page is exactly as tall as the padded viewport (Main publishes --page-h), the controls rest at its
     bottom (thumb zone, inside any root padding / safe area) and the picture is centred in the space above them. No band below. */
  html.touch:not(.land) body { min-height: var(--page-h, 100%); }
  /* V4: the picture and its PAUSE / SOUND strip are centred in the free height above the pads (Main publishes --gap-top = half of what is left over) with the PAUSE / SOUND strip right under it, the four big
     pads rest at the bottom (thumb zone): the free height is split into two moderate gaps instead of one big band above and one below the picture. #touch fills the rest of the
     page; its strip sits at its top, its pads at its bottom. */
  html.touch:not(.land) #stage { flex: 0 0 auto; margin-block: var(--gap-top, 0px) 0; }
  html.touch:not(.land) #touch { flex: 1 1 auto; justify-content: space-between; }
  #frame { position: relative; line-height: 0; max-width: 100%; }
  /* Before the script runs (U10): the frame already has the width the canvas will get, a coarse-pointer page already shows the touch pads and no keyboard legend, and the canvas
     shows the LOADING frame's gradient: nothing jumps when Main takes over (it adds html.fp with its first fit()). */
  html:not(.fp) #frame { width: min(100%, 768px, calc((100vh - 16px) * 256 / 224)); }
  @media (pointer: coarse) {
    /* the pre-script portrait stack mirrors Main's fit(): picture = full width x 7/8, strip 44 + pads of the leftover height (52..220 px), the rest split above / between */
    html:not(.fp) { --pre-left: calc(100vh - 88px - (100vw - 32px) * 0.875); --pre-btn: clamp(52px, var(--pre-left), 220px); }
    html:not(.fp):not(.land) #touch button { height: var(--pre-btn); }
    html:not(.fp):not(.land) #touch button.sm { height: 44px; }
    html:not(.fp):not(.land) #stage { margin-top: max(0px, calc((var(--pre-left) - var(--pre-btn) + 10px) / 2)); }
    html:not(.fp):not(.land) #legend { display: none; }
    html:not(.fp):not(.land) body { min-height: var(--page-h, 100%); }
    html:not(.fp):not(.land) #stage { flex: 0 0 auto; }
    html:not(.fp):not(.land) #touch { display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; gap: 10px; width: 100%; flex: 1 1 auto; padding: 10px 0 8px; }
  }
  /* The canvas is resolution independent (v2): Main sizes its backing store to css size x devicePixelRatio and draws every frame at that
     scale, so it is displayed 1:1 (or very nearly) with smooth sampling, never pixelated. */
  #screen {
    display: block;
    /* Safe default before Main's fit() sets explicit px sizes: never wider than the page. */
    width: 100%; height: auto; aspect-ratio: 256 / 224;
    background-color: #000;
    background-image: radial-gradient(circle at 50% 48%, rgba(60, 242, 255, 0.18), #04060d 70%);   /* = Main's LOADING frame, visible until the first paint */
    image-rendering: auto;
    border-radius: 2px;
    outline: 1px solid var(--frame);
    box-shadow: 0 0 44px var(--frame-glow);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }

  /* click-to-play / focus overlay (an Artifact iframe starts without keyboard focus). Light veil: the picture stays visible. */
  #focus {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--veil); color: var(--veil-fg);
    border-radius: 2px; cursor: pointer; text-align: center; line-height: 1.3;
    font-weight: 500; letter-spacing: 0.3em; font-size: clamp(13px, 3.4vw, 22px);   /* compact: one pill and one caption line, the menu waits behind it (U8) */
    outline: none; -webkit-tap-highlight-color: transparent;
  }
  #focus .cta {
    padding: 0.32em 1em 0.32em 1.3em; border-radius: 999px;
    background: rgba(3, 7, 18, 0.74); border: 1px solid var(--cta-edge);
    text-shadow: 0 0 10px rgba(60, 242, 255, 0.85), 0 0 2px #eaffff;
    box-shadow: 0 0 22px rgba(60, 242, 255, 0.4), inset 0 0 14px rgba(60, 242, 255, 0.16);
    animation: pulse 1.8s ease-in-out infinite;
  }
  #focus small {
    font-weight: 400; letter-spacing: 0.06em; font-size: clamp(10px, 2.1vw, 13px);
    padding: 2px 10px; border-radius: 8px; background: rgba(3, 7, 18, 0.62); max-width: 90%;
    text-shadow: 0 0 6px rgba(60, 242, 255, 0.5);
  }
  @keyframes pulse { 50% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) { #focus .cta { animation: none; } }

  /* compact controls legend (desktop only; Main hides it when it would cost the picture too much) */
  #legend {
    margin: 12px 0 0; max-width: 940px; text-align: center;
    color: var(--page-muted); font-size: 12px; line-height: 1.9; letter-spacing: 0.03em;
  }
  #legend .grp { display: inline-block; margin: 0 8px; white-space: nowrap; }
  #legend b { color: var(--page-fg); margin-right: 3px; font-weight: 600; letter-spacing: 0.12em; }
  #legend kbd {
    display: inline-block; min-width: 1.6em; padding: 0 5px; margin: 0 1px; text-align: center;
    font: 500 11px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--key-fg); background: var(--key-bg);
    border: 1px solid var(--key-edge); border-radius: 4px;
  }

  /* ---- touch controls: shown for (pointer: coarse) or after the first touch (class .touch on the root element).
     Main's fit() sets --btn-w / --btn-h and one of three arrangements on the root element:
       (none)   portrait: picture on top, then a PAUSE/SOUND row, then the four big buttons directly below it
       .land    landscape: pads at both sides of the picture, PAUSE/SOUND stacked top right
       .over    frames too small for either: the same fixed pads, drawn translucent over the picture's margins ---- */
  #touch { display: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html.touch #legend { display: none; }
  html.touch #touch {
    display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    width: 100%; flex: 0 0 auto; padding: 10px 0 8px;
  }
  #touch .pads { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  #touch .grp { display: flex; gap: 8px; align-items: flex-start; }
  #touch .mid { order: -1; justify-content: center; align-items: center; gap: 16px; }
  /* glass buttons: a dark translucent body, a 1 px lit rim and a soft glow; pressed = the light comes on */
  #touch button {
    appearance: none; -webkit-appearance: none; margin: 0; padding: 0;
    width: var(--btn-w, var(--btn)); height: var(--btn-h, var(--btn)); border-radius: 50%;
    font: 500 12px/1 system-ui, sans-serif; letter-spacing: 0.12em;
    color: var(--btn-fg); background: var(--btn-bg);
    border: 1px solid var(--btn-edge);
    box-shadow: 0 0 14px var(--btn-glow), inset 0 0 12px var(--btn-glow);
    transition: box-shadow 0.08s, background-color 0.08s;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  html:not(.land) #touch .pads button { border-radius: 24px; }
  /* U12: the label scales with the button (BUBBLE never runs over its rim, also on the smallest landscape pads) */
  #touch .pads button:not([data-k="left"]):not([data-k="right"]) { font-size: clamp(9px, calc(var(--btn-w, 68px) * 0.17), 12px); letter-spacing: 0.06em; }
  #touch button[data-k="left"], #touch button[data-k="right"] { font-size: 26px; letter-spacing: 0; }
  #touch button.on { background: var(--btn-on); color: var(--btn-on-fg); border-color: #eaffff; box-shadow: 0 0 22px rgba(60, 242, 255, 0.55), inset 0 0 16px rgba(60, 242, 255, 0.35); }
  #touch button.sm { width: auto; min-width: 96px; height: 44px; padding: 0 18px; border-radius: 22px; font-size: 12px; letter-spacing: 0.2em; }
  #touch button[data-k="sound"][data-muted="1"] { text-decoration: line-through; opacity: 0.7; }

  /* landscape + overlay: the groups are fixed to the screen sides so they never push the picture around */
  html.touch.land #touch { position: fixed; inset: 0; display: block; padding: 0; pointer-events: none; }
  html.touch.land #touch .pads { display: block; }
  html.touch.land #touch .grp { position: absolute; pointer-events: auto; }
  /* inside the root padding Main measured (--pad-*: a host that pads :root for safe areas) and inside env() insets, whichever is larger (R3) */
  html.touch.land #touch .left { left: max(calc(var(--pad-l, 0px) + 12px), env(safe-area-inset-left)); bottom: max(calc(var(--pad-b, 0px) + 12px), env(safe-area-inset-bottom)); align-items: flex-end; }
  html.touch.land #touch .right { right: max(calc(var(--pad-r, 0px) + 12px), env(safe-area-inset-right)); bottom: max(calc(var(--pad-b, 0px) + 12px), env(safe-area-inset-bottom)); align-items: flex-end; }
  html.touch.land #touch .mid {
    top: max(calc(var(--pad-t, 0px) + 12px), env(safe-area-inset-top)); right: max(calc(var(--pad-r, 0px) + 12px), env(safe-area-inset-right));
    flex-direction: column; align-items: flex-end; gap: 8px;
  }
  html.touch.over #touch .grp { opacity: 0.62; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="screen" width="256" height="224" role="img" aria-label="Fizz and Pop game screen"></canvas>
    <div id="focus" role="button" tabindex="0" hidden>
      <span class="cta">CLICK TO PLAY</span>
      <small>Click here to focus the game and switch the sound on</small>
    </div>
  </div>
  <p id="legend">
    <span class="grp"><b>P1</b> <kbd>&larr;</kbd><kbd>&rarr;</kbd> move <kbd>&uarr;</kbd>/<kbd>X</kbd> jump <kbd>Space</kbd>/<kbd>Z</kbd> bubble</span>
    <span class="grp"><b>P2</b> <kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>Q</kbd>/<kbd>Left Shift</kbd> bubble <small>(keys follow the WASD block)</small></span>
    <span class="grp"><b>Pad</b> stick / d-pad move <kbd>A</kbd> jump <kbd>B</kbd> bubble <kbd>Start</kbd> pause</span>
    <span class="grp"><kbd>Enter</kbd> start <kbd>P</kbd> pause <kbd>M</kbd> sound <kbd>H</kbd> help</span>
  </p>
  <noscript><p style="color:var(--page-fg)">Fizz &amp; Pop needs JavaScript.</p></noscript>
</div>
<div id="touch" aria-label="Touch controls">
  <div class="grp mid"><button type="button" class="sm" data-k="pause" tabindex="-1">PAUSE</button><button type="button" class="sm" data-k="sound" tabindex="-1">SOUND</button></div>
  <div class="pads">
    <div class="grp left"><button type="button" data-k="left" tabindex="-1" aria-label="Move left">&#9664;</button><button type="button" data-k="right" tabindex="-1" aria-label="Move right">&#9654;</button></div>
    <div class="grp right"><button type="button" data-k="fire" tabindex="-1">BUBBLE</button><button type="button" data-k="jump" tabindex="-1">JUMP</button></div>
  </div>
</div>
<!--@@SCRIPTS@@-->
</body>
</html>
